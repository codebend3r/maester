name: 🩺 Smoke test

# Builds each product's production image and checks that it starts and serves
# its health route. Called by pull-request-checks.yml on every PR and by
# main-smoke-test.yml after each merge into main; it has no trigger of its own.
on:
  workflow_call:
    inputs:
      # Uploads raven's health checked image as the `raven-image` artifact,
      # for main-smoke-test.yml to publish.
      save-raven-image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  luwin:
    name: 🩺 luwin build and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: luwin:ci
      PORT: 8020
      VERSION_FILE: apps/luwin/VERSION
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Built from the repo root, as compose does; the Dockerfile's own
      # ignore file keeps the context to what it copies.
      - name: 🐳 Build image
        run: docker build -f apps/luwin/Dockerfile -t "$IMAGE" .

      - name: 🏷️ Entrypoint reports the release version
        run: |
          expected="luwin $(cat "$VERSION_FILE")"
          actual="$(docker run --rm "$IMAGE" luwin --version)"
          echo "expected: $expected"
          echo "actual:   $actual"
          test "$actual" = "$expected"

      # The default CMD does not serve HTTP yet, so start the web app
      # explicitly. /health is ungated, so no .env is needed.
      - name: ▶️ Start web app
        run: |
          docker run -d --name luwin -p "$PORT:$PORT" "$IMAGE" \
            uvicorn luwin.web:create_app --factory --host 0.0.0.0 --port "$PORT"

      - name: 🩺 Wait for /health
        run: |
          for _ in $(seq 1 30); do
            if body="$(curl -fsS "http://127.0.0.1:$PORT/health")"; then
              echo "$body"
              echo "$body" | jq -e --arg v "$(cat "$VERSION_FILE")" \
                '.status == "ok" and .version == $v'
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not respond within 30s"
          exit 1

      - name: 📜 Container logs
        if: always()
        run: docker logs luwin || true

      - name: 🧹 Stop container
        if: always()
        run: docker rm -f luwin || true

  raven:
    name: 🩺 raven build and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: raven:ci
      PORT: 8484
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Built from the repo root, as compose does; the Dockerfile's own
      # ignore file keeps the context to what it copies.
      # The source label links the published package to this repo.
      - name: 🐳 Build image
        run: |
          docker build -f apps/raven/Dockerfile -t "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: ▶️ Start server
        run: docker run -d --name raven -p "$PORT:$PORT" "$IMAGE"

      # The image's Debian ffmpeg has zscale, so HDR thumbnails are tone mapped.
      - name: 🩺 Wait for /api/health
        run: |
          for _ in $(seq 1 30); do
            if body="$(curl -fsS "http://127.0.0.1:$PORT/api/health")"; then
              echo "$body"
              echo "$body" | jq -e '.status == "ok" and .ffmpeg != null and .tonemap == true'
              curl -fsS -o /dev/null "http://127.0.0.1:$PORT/"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/health did not respond within 30s"
          exit 1

      - name: 💾 Save image
        if: inputs.save-raven-image
        run: docker save "$IMAGE" | gzip -1 > raven-image.tar.gz

      - name: 📤 Upload image
        if: inputs.save-raven-image
        uses: actions/upload-artifact@v7
        with:
          name: raven-image
          path: raven-image.tar.gz
          retention-days: 1
          # Already gzipped.
          compression-level: 0

      - name: 📜 Container logs
        if: always()
        run: docker logs raven || true

      - name: 🧹 Stop container
        if: always()
        run: docker rm -f raven || true

  rookery:
    name: 🩺 rookery build and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: rookery:ci
      PORT: 8030
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Built from the repo root, as compose does; the Dockerfile's own
      # ignore file keeps the context to what it copies.
      - name: 🐳 Build image
        run: docker build -f apps/rookery/Dockerfile -t "$IMAGE" .

      # rookery refuses to boot without its required settings, so the check
      # passes placeholders; nothing here signs anyone in.
      - name: ▶️ Start server
        run: |
          docker run -d --name rookery -p "$PORT:$PORT" \
            -e PUBLIC_URL=http://127.0.0.1:8030 -e SERVICE_TOKEN=ci "$IMAGE"

      - name: 🩺 Wait for /health
        run: |
          for _ in $(seq 1 30); do
            if body="$(curl -fsS "http://127.0.0.1:$PORT/health")"; then
              echo "$body"
              echo "$body" | jq -e '.status == "ok"'
              curl -fsS -o /dev/null "http://127.0.0.1:$PORT/login"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not respond within 30s"
          exit 1

      - name: 📜 Container logs
        if: always()
        run: docker logs rookery || true

      - name: 🧹 Stop container
        if: always()
        run: docker rm -f rookery || true
