name: 🏷️ Release

# Runs on every pushed vX.Y.Z tag (scripts/bump_version.sh --push) and nowhere
# else: publishes the tag's GitHub release, so every tag has one. A tag alone
# never shows up as a release. The notes list the commits since the tag before
# it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: 🏷️ Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Publishing the release writes to the repo; nothing else here does.
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          # Every commit and tag, to find the tag this one follows.
          fetch-depth: 0

      # The notes come from the commits between the tag before this one and
      # this one, not GitHub's generated notes: those find a PR by its merge
      # commit, so they drop any PR whose commit main has since rewritten, and
      # every commit pushed to main without a PR.
      - name: 🏷️ Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release; leaving it as it is."
            exit 0
          fi
          range=$TAG
          compare=commits/$TAG
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2> /dev/null); then
            range=$previous..$TAG
            compare=compare/$previous...$TAG
          fi
          {
            echo "## What's Changed"
            echo
            git log --reverse --no-merges --format='* %s' \
              --invert-grep --grep="^Release $TAG\$" "$range"
            echo
            echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/$compare"
          } > notes.md
          args=(--verify-tag --title "$TAG" --notes-file notes.md)
          if [[ $TAG == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
