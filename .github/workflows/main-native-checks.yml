name: 🧱 Main native checks

# Every push to main runs affected desktop, device app, Wren and Windows checks.
# These checks never block pull requests. A failure emails the pusher,
# as any failed run on main does.
# Run it by hand from the Actions tab on any branch to check before merging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# No concurrency group: every push must build, without replacing a pending run.
jobs:
  affected:
    name: 🔎 Select affected native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app: ${{ steps.select.outputs.app }}
      music: ${{ steps.select.outputs.music }}
      desktop: ${{ steps.select.outputs.desktop }}
    steps:
      - name: 📥 Checkout exact commit and history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🔎 Select checks since the last successful ancestor
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NX_DAEMON: 'false'
        run: python3 scripts/select_native_checks.py

  native:
    name: 🧱 Native apps
    needs: affected
    if: needs.affected.outputs.app == 'true' || needs.affected.outputs.music == 'true' || needs.affected.outputs.desktop == 'true'
    uses: ./.github/workflows/native-checks.yml
    with:
      sha: ${{ github.sha }}
      app: ${{ needs.affected.outputs.app == 'true' }}
      music: ${{ needs.affected.outputs.music == 'true' }}
      windows: ${{ needs.affected.outputs.desktop == 'true' }}
    secrets: inherit

  # One native build feeds packaging and both playback checks through an artifact.
  desktop-native:
    name: 🎞️ Desktop native
    needs: affected
    if: needs.affected.outputs.desktop == 'true'
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Shared with desktop-release.yml so a release builds as this does.
      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # A tar keeps ffmpeg's execute bit, which an artifact drops.
      - name: 📦 Pack the playback handoff
        run: >-
          tar -cf "$RUNNER_TEMP/raven-native-handoff.tar"
          libs/raven/mpv/resources/darwin-arm64
          libs/raven/mpv/native-build/prefix/bin/ffmpeg

      # Only the jobs below read it, so it lives for a day.
      - name: 📤 Playback handoff
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/raven-native-handoff.tar
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the handoff its first attempt left.
          overwrite: true

      # Both only read the built resources, so Nx runs them at once.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bun run mpv:native

      - name: 📤 Native playback resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-darwin-arm64-${{ github.sha }}
          path: libs/raven/mpv/resources/darwin-arm64
          if-no-files-found: error

      # mpv's GPL and FFmpeg's LGPL want the matching source beside the binaries.
      - name: 📤 Matching native sources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-sources-${{ github.sha }}
          path: libs/raven/mpv/native-build/source-bundle
          if-no-files-found: error

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the native build.
  desktop-app:
    name: 📦 Desktop app
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached app is keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 📥 Native handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the native handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      - name: 📦 Make the unsigned app
        run: bun run desktop:make

      # otool, lipo and codesign over every Mach-O file in the app.
      - name: 🔎 Audit the packaged bundle
        run: bun run desktop:audit:bundle

      # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      - name: 📤 Unsigned Raven
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-darwin-arm64-${{ github.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

  desktop-playback:
    name: ${{ matrix.check.name }}
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: 🧪 Desktop player against headless libmpv
            target: test:native
          # Runs `electron .`, never the packaged app, whose fuses turn off the inspector
          # Playwright needs. The target's `install:electron` step fetches the binary.
          - name: 🎬 Desktop end to end
            target: e2e
            traces: true
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached results are keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # `-allow_sw 1` falls back to Apple's software H.264 encoder on a VM.
      RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 📥 Playback handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: 📂 Unpack the playback handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Cached on the desktop and native sources and the Xcode version.
      - name: ${{ matrix.check.name }}
        run: bun run desktop:${{ matrix.check.target }}

      - name: 📤 End to end traces
        if: failure() && matrix.check.traces
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ github.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore
