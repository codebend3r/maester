name: 🧱 Main native checks

# Every push to main runs the affected desktop, device app, Wren and Windows checks on the
# merge commit, against the last green ancestor. The same checks gate every pull request
# (pull-request-checks.yml), so what merges has already passed them; this run catches what the
# merge itself changed, and a failure emails the pusher, as any failed run on main does.
# Run it by hand from the Actions tab on any branch to run every group.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# No concurrency group: every push must build, without replacing a pending run.
jobs:
  # With no base, the shared workflow selects against this workflow's last green run on main,
  # and a manual run selects every group.
  native:
    name: 🧱 Native apps
    uses: ./.github/workflows/native-checks.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
