name: 🧱 Main native checks

# Every push to main runs the end to end suites: raven's web app in Chrome, and the affected
# desktop, device app and Wren flows, against the last green ancestor. A pull request only
# builds the native apps (pull-request-checks.yml), so it hears back sooner; this run takes
# the builds the merged pull request uploaded and runs the flows on them, building only a
# group it finds no build for. So an end to end failure shows here first, after the merge,
# and emails the pusher, as any failed run on main does.
# Run it by hand from the Actions tab on any branch to build and test every group.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# No concurrency group: every push must be tested, without replacing a pending run.
jobs:
  # With no base, the shared workflow selects against this workflow's last green run on main,
  # and a manual run selects every group.
  native:
    name: 🧱 Native apps
    uses: ./.github/workflows/native-checks.yml
    with:
      sha: ${{ github.sha }}
      stage: e2e
    secrets: inherit

  # raven's web app in Google Chrome, which the runner image has, against the server's
  # fixture, which encodes its clips with ffmpeg. Run on every push, not only where
  # `@raven/web` is affected: the suite drives the server too, which the web does not depend
  # on in the project graph, and the target's inputs name the server's sources, so Nx
  # restores it from the cache when neither changed.
  web-e2e:
    name: 🌐 Web end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # scripts/install_ffmpeg.sh holds the pin, shared with the pull request checks.
      - name: 🎞️ Install test system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          sudo bash scripts/install_ffmpeg.sh

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # `static` keeps every test's output; Nx's CI default collapses passing tasks.
      - name: 🌐 Web end to end
        run: bunx nx run-many --outputStyle=static -t e2e:browser

      # Playwright keeps a failed test's trace, which shows each step's page.
      - name: 📤 Upload the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ github.sha }}
          path: apps/raven/web/test-results
          if-no-files-found: ignore
