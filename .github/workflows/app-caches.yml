name: 🗃️ App build caches

# Builds raven's device app on main and saves what the next build reads: ccache's
# objects, CocoaPods' and Gradle's downloads, Gradle's build cache, Homebrew's and apt's
# packages, and the Android TV emulator's snapshot. A pull request's caches are scoped
# to its own ref, so when each PR saved its own the repo's cache filled with copies;
# main's are readable by every PR, whose app jobs in pull-request-checks.yml only
# restore. The two set up through the same actions, raven-app-setup and
# raven-android-avd, so the caches match. It runs when what the native projects or those
# settings are made from changes, weekly so the compile caches follow the sources and are
# never evicted for going unused, and by hand.
on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - apps/raven/app/package.json
      - apps/raven/app/app.config.ts
      - apps/raven/app/plugins/**
      - .github/actions/raven-app-setup/**
      - .github/actions/raven-android-avd/**
      - .github/workflows/app-caches.yml
      - .github/workflows/pull-request-checks.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # As pull-request-checks.yml's, which every other job there shares too.
  APP_NODE_VERSION: 24.21.0

jobs:
  apple:
    name: ${{ matrix.platform.name }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 📱 iPhone and iPad caches
            id: ios
          - name: 📺 Apple TV caches
            id: tvos
    env:
      # As pull-request-checks.yml's, which its desktop jobs share too.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Set up the app build
        id: setup
        uses: ./.github/actions/raven-app-setup
        with:
          platform: ${{ matrix.platform.id }}
          node-version: ${{ env.APP_NODE_VERSION }}

      # Past Nx's cache, which would otherwise restore the build and compile nothing.
      - name: 🔨 Build for the simulator
        run: bunx nx run @raven/app:build:${{ matrix.platform.id }} --excludeTaskDependencies --skip-nx-cache

      - name: 📊 ccache
        run: ccache --show-stats

      - name: 💾 Save Homebrew's packages
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.packages-path }}
          key: ${{ steps.setup.outputs.packages-key }}

      - name: 💾 Save CocoaPods' downloads
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.dependencies-path }}
          key: ${{ steps.setup.outputs.dependencies-key }}

      - name: 💾 Save ccache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.ccache-path }}
          key: ${{ steps.setup.outputs.ccache-key }}

  android-tv:
    name: 📺 Android TV caches
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Set up the app build
        id: setup
        uses: ./.github/actions/raven-app-setup
        with:
          platform: android-tv
          node-version: ${{ env.APP_NODE_VERSION }}

      # Past Nx's cache, which would otherwise restore the APK and compile nothing.
      - name: 🔨 Build the Android TV APK
        run: bunx nx run @raven/app:build:android-tv --excludeTaskDependencies --skip-nx-cache

      - name: 📊 ccache
        run: ccache --show-stats

      - name: 💾 Save apt's packages
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.packages-path }}
          key: ${{ steps.setup.outputs.packages-key }}

      - name: 💾 Save Gradle's downloads and build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.dependencies-path }}
          key: ${{ steps.setup.outputs.dependencies-key }}

      - name: 💾 Save ccache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.ccache-path }}
          key: ${{ steps.setup.outputs.ccache-key }}

      # Makes and boots the AVD when main has no snapshot under the current key.
      - name: 📺 Android TV AVD
        id: avd
        uses: ./.github/actions/raven-android-avd

      - name: 💾 Save the Android TV AVD
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.avd.outputs.path }}
          key: ${{ steps.avd.outputs.key }}
