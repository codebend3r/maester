name: 🧱 Native checks

# The end to end suites, which run here and nowhere else: raven's web app and Wren on the web in
# Chrome, and the affected desktop, device app and Wren flows. Every push to main runs it, against
# the last green ancestor. Nothing is built here: a pull request builds the native apps
# (pull-request-checks.yml) and uploads them, and this run downloads the merged pull request's
# builds and runs the flows on them. A selected group with no build to find (a push with no pull
# request, an expired artifact, a group the pull request never built) fails its end to end job,
# saying so. An end to end failure shows here, after the merge, and emails the pusher, as any failed
# run on main does.
# The device apps' screen tests (`test:screens`) run here too, and on no pull request.
# A "Release vX.Y.Z" commit (the version-bump skill) runs none of it: it changes only versions,
# its own pull request builds nothing to test, and the merge before it already ran the flows.
#
# Every job is listed here: no workflow is called and no job is a matrix row. A pull request
# selects nothing and builds every group; the selection here picks the flows a push runs. What a
# device needs is its job's `APP_*` variables, and the end to end jobs share one list of steps.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

env:
  # Nx Cloud's remote cache, for every job: each reads and fills it, so a task any job or any
  # earlier run finished is restored, not run again.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # raven's device app loads babel.config.ts through Node's own type stripping, which
  # needs Node 22.18 or newer, wherever Metro or jest-expo runs. `test_native_ci.py` holds every
  # workflow to the same version.
  APP_NODE_VERSION: 24.21.0
  # The commit the selection plans for. No base: the selection diffs a push against this
  # workflow's last green run on main.
  NATIVE_BUILD_SHA: ${{ github.sha }}
  NATIVE_SELECT_BASE: ''

# No concurrency group: every push must be tested, without replacing a pending run.
jobs:
  # Which groups the commit touches (raven's device app, Wren, the desktop) and the plan for each,
  # which every end to end job below reads: whether the commit selected it and which run and
  # commit hold its builds. The action says how it decides.
  select:
    name: 🔎 Select affected native checks
    if: &not-a-release ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    outputs:
      app_selected: ${{ steps.plan.outputs.app_selected }}
      app_build: ${{ steps.plan.outputs.app_build }}
      app_run: ${{ steps.plan.outputs.app_run }}
      app_sha: ${{ steps.plan.outputs.app_sha }}
      music_selected: ${{ steps.plan.outputs.music_selected }}
      music_build: ${{ steps.plan.outputs.music_build }}
      music_run: ${{ steps.plan.outputs.music_run }}
      music_sha: ${{ steps.plan.outputs.music_sha }}
      desktop_selected: ${{ steps.plan.outputs.desktop_selected }}
      desktop_build: ${{ steps.plan.outputs.desktop_build }}
      desktop_run: ${{ steps.plan.outputs.desktop_run }}
      desktop_sha: ${{ steps.plan.outputs.desktop_sha }}
    steps:
      # The run's own commit, the push's head, which the script reads as GITHUB_SHA. The whole
      # history, so Nx can diff it against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🗺️ Select and plan the native groups
        id: plan
        uses: ./.github/actions/raven-native-select
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}
          base: ${{ env.NATIVE_SELECT_BASE }}

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The flows of every device that has them, against a real raven server: Maestro on the iPhone
  # simulator and on an Android TV emulator, driven by the remote's keys, and an XCUITest that
  # drives the Apple TV with the Siri Remote. Each on its own device's build, the one the merged
  # pull request uploaded. Each timeout covers the simulator's or emulator's boot and the flows,
  # twice over when Maestro's driver is retried.
  #
  # Every flow in `apps/raven/app/e2e` but the remote's (`dpad`), each opening on the accountless
  # fixture's Home. A device's `APP_SETUP`, `APP_PROJECT`, `APP_ARTIFACT` and `APP_BUNDLE` are
  # its build job's in pull-request-checks.yml, which `test_native_ci.py` checks.
  e2e-iphone:
    name: 🎬 E2E Raven iPhone
    needs: select
    if: needs.select.outputs.app_selected == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The run that holds the build and the commit it is named for.
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_MISSING: ${{ needs.select.outputs.app_build }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: ios
      APP_PROJECT: apps/raven/app
      APP_ARTIFACT: raven-app-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Raven.app
      APP_SIMULATOR: raven-phone
      APP_SDK: iphonesimulator
      APP_RUNTIME: iOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      APP_DRIVER: maestro
      APP_FLOWS: bun run app:e2e
      APP_LOGS: raven-app-e2e-logs
    steps: &e2e-steps
      # The plan asks to build a group the merged pull request left no build of, and main
      # builds nothing, so say so rather than fail on a missing artifact.
      - &no-build
        name: 🚫 No pull request build
        if: env.BUILD_MISSING == 'true'
        run: |
          echo "::error::No build of this group from the merged pull request (none, or expired). Open a pull request so its checks build it."
          exit 1

      # The commit under test, whose flows run on the build.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The build job's setup without the compile's caches and the NDK: Bun, Node, JDK 17 on
      # Android (Maestro runs on it), ffmpeg, the build environment (an Nx input of the
      # flows), the install and the libraries the fixture server runs on.
      - name: 🧰 Set up the app tools
        uses: ./.github/actions/raven-app-setup
        with:
          platform: ${{ env.APP_SETUP }}
          project: ${{ env.APP_PROJECT }}
          node-version: ${{ env.APP_NODE_VERSION }}
          compiles: false

      # A real, accountless raven server with open film, series and music libraries, started
      # in the background while the tools and the build download. It prints its ready line
      # once its libraries are scanned.
      - name: 🗄️ Start the fixture server
        run: bunx nx run @raven/server:serve:fixture --excludeTaskDependencies > "$RUNNER_TEMP/fixture.log" 2>&1 &

      # Maestro's own release, the zip its Homebrew formula installs, pinned by version and
      # checksum. It runs on the runner's Java.
      - name: 🎭 Install Maestro
        if: env.APP_DRIVER == 'maestro'
        uses: ./.github/actions/raven-maestro

      # The zipped simulator app, or the APK back where the build job built it. The token
      # lets it read another run's artifact, the pull request's.
      - name: 📥 The build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT }}-${{ env.BUILD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.APP_BUNDLE != '' && runner.temp || format('{0}/android/app/build/outputs/apk/release', env.APP_PROJECT) }}

      # Back where the build job built it, with the execute bits the zip kept.
      - name: 📦 Unpack the simulator app
        if: env.APP_BUNDLE != ''
        working-directory: ${{ env.APP_PROJECT }}
        run: |
          products="$(dirname "${{ env.APP_BUNDLE }}")"
          mkdir -p "$products"
          ditto -x -k "$RUNNER_TEMP/simulator-app.zip" "$products"

      - name: 📥 Remote test project
        if: env.APP_DRIVER == 'xcuitest'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT }}-test-project-${{ env.BUILD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      # Back where the build job built it, which is where `e2e:tvos` reads it.
      - name: 📦 Unpack the remote test project
        if: env.APP_DRIVER == 'xcuitest'
        working-directory: ${{ env.APP_PROJECT }}
        run: tar -xzf "$RUNNER_TEMP/remote-test-project.tgz"

      # The Android TV emulator's settings and KVM, and the AVD with its booted snapshot,
      # restored from what app-caches.yml saved on main (a PR's own 2.7 GB copy would be its
      # alone), or made and booted once on a miss.
      - name: 📺 Android TV AVD
        if: env.APP_BUNDLE == ''
        id: avd
        uses: ./.github/actions/raven-android-avd

      # A fresh simulator on the runtime of the selected Xcode's SDK, booted, with the build
      # on it. A runner with no such runtime fails here rather than testing on another. A new
      # iPhone simulator shows the keyboard's slide to type tutorial the second time the
      # keyboard comes up, and it held the app's main thread for 30 s under the search flow,
      # so the simulator is told it has shown it.
      - name: 📱 Boot the simulator
        if: env.APP_BUNDLE != ''
        uses: ./.github/actions/raven-simulator
        with:
          sdk: ${{ env.APP_SDK }}
          runtime: ${{ env.APP_RUNTIME }}
          name: ${{ env.APP_SIMULATOR }}
          device-type: ${{ env.APP_DEVICE_TYPE }}
          app: ${{ env.APP_PROJECT }}/${{ env.APP_BUNDLE }}
          skip-keyboard-intro: ${{ env.APP_RUNTIME == 'iOS' }}

      - name: 🗄️ Wait for the fixture server
        uses: ./.github/actions/raven-fixture-ready

      # A fresh runner can start Maestro's XCTest driver slower than it waits by default, so
      # it waits five minutes (in milliseconds). A busy macOS runner can still miss even that,
      # before any flow runs, so a driver that never came up is retried once as a dead
      # screenshot service is.
      - name: 🎬 Flows on the simulator
        if: env.APP_BUNDLE != '' && env.APP_DRIVER == 'maestro'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: |
          set -o pipefail
          first="$RUNNER_TEMP/e2e-first.log"
          if ${{ env.APP_FLOWS }} 2>&1 | tee "$first"; then
            exit 0
          fi
          # Maestro's XCTest server dies on a screenshot timeout (upstream #3538).
          if grep -R -F -q 'Failed to get screenshot: Timed out while requesting screenshot.' "$HOME/.maestro/tests"; then
            echo '::warning::Maestro screenshot service timed out; rebooting the simulator and retrying once'
          elif grep -F -q 'iOS driver not ready in time' "$first"; then
            echo "::warning::Maestro's iOS driver did not start in time; rebooting the simulator and retrying once"
          else
            exit 1
          fi
          xcrun simctl shutdown "$APP_SIMULATOR"
          xcrun simctl boot "$APP_SIMULATOR"
          xcrun simctl bootstatus "$APP_SIMULATOR" -b
          ${{ env.APP_FLOWS }}

      # The screen the flow ends on goes up as an artifact.
      - name: 🎬 Flow with the Siri Remote
        if: env.APP_DRIVER == 'xcuitest'
        env:
          TVOS_SIMULATOR: ${{ env.APP_SIMULATOR }}
        run: |
          ${{ env.APP_FLOWS }}
          xcrun simctl io "$TVOS_SIMULATOR" screenshot "$RUNNER_TEMP/$TVOS_SIMULATOR.png"
          xcrun simctl shutdown "$TVOS_SIMULATOR"

      # Boots the AVD from its snapshot, installs the APK and runs the flows. The runner runs
      # each line of the script as its own command. Maestro's driver can start slower on a
      # fresh emulator than it waits by default, so it waits five minutes (in milliseconds).
      - name: 🎬 Flows on the emulator
        if: env.APP_BUNDLE == ''
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        with:
          api-level: ${{ steps.avd.outputs.api-level }}
          target: ${{ steps.avd.outputs.target }}
          arch: ${{ steps.avd.outputs.arch }}
          profile: ${{ steps.avd.outputs.profile }}
          emulator-build: ${{ steps.avd.outputs.emulator-build }}
          cores: ${{ steps.avd.outputs.cores }}
          ram-size: ${{ steps.avd.outputs.ram-size }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ steps.avd.outputs.emulator-options }}
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb install ${{ env.APP_PROJECT }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.APP_FLOWS }}

      # What the app and the system logged on the simulator, only when a step failed.
      - name: 🪵 Simulator log
        if: failure() && env.APP_BUNDLE != ''
        run: xcrun simctl spawn "$APP_SIMULATOR" log show --last 30m --style compact --predicate "process == \"$(basename "$APP_BUNDLE" .app)\"" > "$RUNNER_TEMP/simulator.log" || true

      # Maestro's screenshots and logs or the XCUITest's, the simulator's log and the fixture
      # server's, only when a step failed.
      - name: 📤 End to end logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_LOGS }}-${{ github.sha }}
          path: |
            ~/.maestro/tests
            ${{ env.APP_PROJECT }}/build/tvos-e2e/Logs/Test
            ${{ runner.temp }}/fixture.log
            ${{ runner.temp }}/simulator.log
          if-no-files-found: ignore

      # The screen the Siri Remote's flow ended on.
      - name: 📤 End to end screen
        if: env.APP_DRIVER == 'xcuitest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_LOGS }}-screen-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.APP_SIMULATOR }}.png
          if-no-files-found: error

  # The XCUITests the tvOS prebuild added (`tvos-e2e/`) open on Home, play the film, leave with
  # Menu and find it under Continue watching, all with the Siri Remote.
  e2e-apple-tv:
    name: 🎬 E2E Raven Apple TV
    needs: select
    if: needs.select.outputs.app_selected == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_MISSING: ${{ needs.select.outputs.app_build }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: tvos
      APP_PROJECT: apps/raven/app
      APP_ARTIFACT: raven-app-tvos-simulator
      APP_BUNDLE: build/tvos/Build/Products/Release-appletvsimulator/Raven.app
      APP_SIMULATOR: raven-tv
      APP_SDK: appletvsimulator
      APP_RUNTIME: tvOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
      APP_DRIVER: xcuitest
      APP_FLOWS: bun run app:e2e:tvos
      APP_LOGS: raven-app-tvos-e2e-logs
    steps: *e2e-steps

  # Every flow the remote drives (`e2e:android-tv`, all but the touch ones), which first point the
  # emulator's 127.0.0.1:8490 at the runner's with `adb reverse`, so the app signs in to the address
  # the iPhone uses. The phone's touch flows need a phone emulator of their own, so it has none yet.
  # The flows drive the device ANDROID_SERIAL names and no other: the runner's one emulator takes
  # adb's first serial.
  e2e-android-tv:
    name: 🎬 E2E Raven Android TV
    needs: select
    if: needs.select.outputs.app_selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_MISSING: ${{ needs.select.outputs.app_build }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/app
      APP_ARTIFACT: raven-app-android-tv
      APP_BUNDLE: ''
      APP_DRIVER: maestro
      APP_FLOWS: bun run app:e2e:android-tv
      APP_LOGS: raven-app-android-tv-e2e-logs
      ANDROID_SERIAL: emulator-5554
    steps: *e2e-steps

  # Every flow in `apps/wren/wren-app/e2e`: open on Home, play the fixture's album, and download it,
  # on a simulator of Wren's own, as `ci:wren` makes one. Wren on Android has no flows yet.
  e2e-wren-iphone:
    name: 🎵 E2E Wren iPhone
    needs: select
    if: needs.select.outputs.music_selected == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ needs.select.outputs.music_run }}
      BUILD_MISSING: ${{ needs.select.outputs.music_build }}
      BUILD_SHA: ${{ needs.select.outputs.music_sha }}
      APP_SETUP: ios
      APP_PROJECT: apps/wren/wren-app
      APP_ARTIFACT: raven-music-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Wren.app
      APP_SIMULATOR: wren-phone
      APP_SDK: iphonesimulator
      APP_RUNTIME: iOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      APP_DRIVER: maestro
      APP_FLOWS: bunx nx run @wren/app:e2e
      APP_LOGS: raven-music-e2e-logs
    steps: *e2e-steps

  # Wren on TV's Siri Remote XCUITest (`apps/wren/wren-tv/tvos-e2e`): open on Home, play the
  # fixture's album, and find it in Library, on a simulator of its own.
  e2e-wren-apple-tv:
    name: 🎵 E2E Wren Apple TV
    needs: select
    if: needs.select.outputs.music_selected == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_RUN_ID: ${{ needs.select.outputs.music_run }}
      BUILD_MISSING: ${{ needs.select.outputs.music_build }}
      BUILD_SHA: ${{ needs.select.outputs.music_sha }}
      APP_SETUP: tvos
      APP_PROJECT: apps/wren/wren-tv
      APP_ARTIFACT: wren-tv-tvos-simulator
      APP_BUNDLE: build/tvos/Build/Products/Release-appletvsimulator/Wren.app
      APP_SIMULATOR: wren-tv
      APP_SDK: appletvsimulator
      APP_RUNTIME: tvOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
      APP_DRIVER: xcuitest
      APP_FLOWS: bun run wren:tv:e2e:tvos
      APP_LOGS: wren-tv-tvos-e2e-logs
    steps: *e2e-steps

  # Every flow in `apps/wren/wren-tv/e2e`, driven by the remote's keys on the Android TV emulator.
  e2e-wren-android-tv:
    name: 🎵 E2E Wren Android TV
    needs: select
    if: needs.select.outputs.music_selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ needs.select.outputs.music_run }}
      BUILD_MISSING: ${{ needs.select.outputs.music_build }}
      BUILD_SHA: ${{ needs.select.outputs.music_sha }}
      APP_SETUP: android-tv
      APP_PROJECT: apps/wren/wren-tv
      APP_ARTIFACT: wren-tv-android-tv
      APP_BUNDLE: ''
      APP_DRIVER: maestro
      APP_FLOWS: bun run wren:tv:e2e:android-tv
      APP_LOGS: wren-tv-android-tv-e2e-logs
      ANDROID_SERIAL: emulator-5554
    steps: *e2e-steps

  # Raven's Playwright suite, on the native pieces the merged pull request built. It runs
  # `electron .`, never the packaged app, whose fuses turn off the inspector Playwright needs. The
  # target's `install:electron` step fetches the binary.
  desktop-e2e:
    name: 🎬 E2E Raven Mac desktop
    needs: select
    if: needs.select.outputs.desktop_selected == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_MISSING: ${{ needs.select.outputs.desktop_build }}
    steps:
      - *no-build

      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🎬 E2E Raven Mac desktop
        uses: ./.github/actions/raven-mac-playback
        with:
          target: e2e
          build-run-id: ${{ needs.select.outputs.desktop_run }}
          build-sha: ${{ needs.select.outputs.desktop_sha }}

      # Playwright keeps a failed test's trace, which shows each step's page.
      - name: 📤 End to end traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ github.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore

  # raven's web app in Google Chrome, which the runner image has, against the server's
  # fixture, which encodes its clips with ffmpeg. Run on every push, not only where
  # `@raven/web` is affected: the suite drives the server too, which the web does not depend
  # on in the project graph, and the target's inputs name the server's sources, so Nx
  # restores it from the cache when neither changed. What an app needs is its job's `WEB_*`
  # variables, and the two browser jobs share one list of steps.
  web-e2e:
    name: 🌐 E2E Raven web
    if: *not-a-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEB_PROJECT: '@raven/web'
      WEB_DIR: apps/raven/web
      WEB_TRACES: e2e-traces
    steps: &web-e2e-steps
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # scripts/install_ffmpeg.sh holds the pin, shared with the pull request checks.
      - name: 🎞️ Install test system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          sudo bash scripts/install_ffmpeg.sh

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # `static` keeps every test's output; Nx's CI default collapses passing tasks.
      - name: 🌐 End to end in Chrome
        run: bunx nx run-many --outputStyle=static -t e2e:browser -p "$WEB_PROJECT"

      # Playwright keeps a failed test's trace, which shows each step's page.
      - name: 📤 Upload the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEB_TRACES }}-${{ github.sha }}
          path: ${{ env.WEB_DIR }}/test-results
          if-no-files-found: ignore

  # Wren on the web in Google Chrome, against a fixture server of its own, on its own port: the
  # album played from its page, the bar, Now Playing, Search, Library, favourites, playlists,
  # Settings and the phone layout. Run on every push, as raven's web suite is, and restored from
  # the cache while Wren on the web, its libraries and the server are unchanged.
  wren-web-e2e:
    name: 🎵 E2E Wren web
    if: *not-a-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEB_PROJECT: '@wren/web'
      WEB_DIR: apps/wren/wren-web
      WEB_TRACES: wren-e2e-traces
    steps: *web-e2e-steps

  # The device apps' render tests under jest-expo (`test:screens`, raven's device app and Wren),
  # on main only so a pull request hears back sooner. Run on every push, as the web's suite is:
  # Nx restores each project's pass from the cache while neither it nor a library it builds on
  # changed.
  screen-tests:
    name: 📸 Screen tests
    if: *not-a-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # jest-expo loads babel.config.ts through Node's type stripping.
      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # `static` keeps every test's output; Nx's CI default collapses passing tasks.
      - name: 📸 Screen tests
        run: bunx nx run-many --outputStyle=static -t test:screens
