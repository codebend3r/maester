name: 🧱 Native app checks

# The builds and end to end flows that take longest: raven's device app on iPhone, iPad,
# Apple TV, Android TV and Android phones, Wren on iPhone and Android, and the macOS and
# Windows desktop.
# Called by pull-request-checks.yml for every pull request and by main-native-checks.yml for
# every push to main; its first job selects the groups the commit affects and the rest run
# only when theirs was selected. A job's name starts with what it does: 🏗️ Build, 🎬 E2E or
# 🧪 Test.
#
# The two callers run two stages of it, so a pull request hears back sooner:
# - `build`, a pull request's: every build, audit, smoke test and the Mac player's tests, each
#   build uploaded as an artifact named for the pull request's head commit. No end to end job.
# - `e2e`, a push to main's: the end to end jobs alone, on the builds the merged pull request
#   uploaded, which 🔎 Select affected native checks looks up. A group whose builds it does
#   not find (a push with no pull request, a manual run, an expired artifact, a group the pull
#   request never built) is built here first, as it was before, and then tested.
#
# Every device is a job of its own, named for it, with no matrix: 🏗️ Build iPhone uploads its
# build and 🎬 E2E iPhone, which waits for that build alone, runs the flows on it. What a device
# needs is its job's `APP_*` variables, and the builds share one list of steps, as the end to end
# jobs share theirs. A manual run of main-native-checks.yml runs every group.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build, so artifact names match what was built.
        type: string
        required: true
      stage:
        description: "`build` builds and uploads, with no end to end job; `e2e` runs the end to end jobs on the merged pull request's builds, building only what it does not find."
        type: string
        required: true
      base:
        description: A pull request's base commit, which the selection diffs against. Unset, a push to main diffs against its last green run and a manual run runs every group.
        type: string
        required: false
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        description: Nx Cloud's remote cache, for the device app, desktop and Windows jobs. Unset, Nx caches locally only.
        required: false

permissions:
  actions: write
  contents: read

env:
  # pull-request-checks.yml reads the same version for its screen tests; keep them in step.
  # raven's device app loads babel.config.ts through Node's own type stripping, which
  # needs Node 22.18 or newer, wherever Metro or jest-expo runs.
  APP_NODE_VERSION: 24.21.0

jobs:
  # Which groups the commit touches: raven's device app, Wren, and the desktop (macOS and
  # Windows). A pull request diffs against the base it names; a push to main against its last
  # green run; a manual run, or a push with no green ancestor, selects every group. A change
  # to a shared file, a workflow or a script selects every group too.
  #
  # It also plans each group, so no other job has to work it out: whether to build it here, whether
  # to run its end to end jobs, and which run and commit hold its builds. In the `e2e` stage it looks
  # for the pull request the pushed commit merged, that pull request's head commit and its passing
  # checks run, whose artifacts are named for the head commit. A group is found only when every
  # build its end to end jobs read is among them and has not expired; a group not found is built
  # here. A lookup that fails finds nothing, so it never fails the run.
  select:
    name: 🔎 Select affected native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # Per group: `true` to build it in this run, `true` to run its end to end jobs, and the run
      # and the commit its builds are read from.
      app_build: ${{ steps.plan.outputs.app_build }}
      app_e2e: ${{ steps.plan.outputs.app_e2e }}
      app_run: ${{ steps.plan.outputs.app_run }}
      app_sha: ${{ steps.plan.outputs.app_sha }}
      music_build: ${{ steps.plan.outputs.music_build }}
      music_e2e: ${{ steps.plan.outputs.music_e2e }}
      music_run: ${{ steps.plan.outputs.music_run }}
      music_sha: ${{ steps.plan.outputs.music_sha }}
      desktop_build: ${{ steps.plan.outputs.desktop_build }}
      desktop_e2e: ${{ steps.plan.outputs.desktop_e2e }}
      desktop_run: ${{ steps.plan.outputs.desktop_run }}
      desktop_sha: ${{ steps.plan.outputs.desktop_sha }}
    steps:
      # The caller's commit, which the script reads as GITHUB_SHA: a pull request's merge
      # commit with its base, a push's head. The whole history, so Nx can diff it against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The token is for the lookup of main's last green run; a pull request's base skips it.
      - name: 🔎 Select the affected groups
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_BASE: ${{ inputs.base }}
          NX_DAEMON: 'false'
        run: python3 scripts/select_native_checks.py

      # Only where the end to end jobs run: a pull request builds everything it selected.
      - name: 🔎 Find the merged pull request's builds
        id: find
        if: inputs.stage == 'e2e'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: bash scripts/find_pr_builds.sh >> "$GITHUB_OUTPUT"

      # A group found is not built again, and its builds are read from the pull request's run
      # under its head commit; any other selected group is built here and read from this run.
      - name: 🗺️ Plan each group
        id: plan
        env:
          STAGE: ${{ inputs.stage }}
          THIS_RUN: ${{ github.run_id }}
          THIS_SHA: ${{ inputs.sha }}
          FOUND_RUN: ${{ steps.find.outputs.run_id }}
          FOUND_SHA: ${{ steps.find.outputs.sha }}
          SELECTED_app: ${{ steps.select.outputs.app }}
          SELECTED_music: ${{ steps.select.outputs.music }}
          SELECTED_desktop: ${{ steps.select.outputs.desktop }}
          FOUND_app: ${{ steps.find.outputs.app }}
          FOUND_music: ${{ steps.find.outputs.music }}
          FOUND_desktop: ${{ steps.find.outputs.desktop }}
        run: bash scripts/plan_native_stage.sh >> "$GITHUB_OUTPUT"

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The Windows libmpv is a pinned prebuilt, not a source build: this places it under
  # resources/win32-x64, audits the DLL (x64, self-contained, the exports the addon
  # calls), builds the addon against it with MSVC and runs the headless libmpv tests.
  windows-native:
    name: 🏗️ Build Windows native
    needs: select
    if: needs.select.outputs.desktop_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # MSVC's compiler and lib.exe on PATH, as a Developer Command Prompt has them; the
      # addon builds with Ninja against them.
      - name: 🛠️ Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The native tests make their clips with ffmpeg; the image has none. One of BtbN's
      # month-end builds, which it keeps, checked by digest: a package feed that fails can
      # report success with nothing installed.
      - name: 🎞️ Install ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-8.1.zip
          FFMPEG_SHA256: 4a7642b2264c03e8a0ce8a3825b933ee5580656f45695a086fe7e294045ffc0a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.zip"
          curl -fsSL -o "$archive" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ffmpeg"
          bin="$(dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe | head -n 1)")"
          "$bin/ffmpeg.exe" -version | head -n 1
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: 🔩 Fetch libmpv, build the addon, audit and test them
        run: bun run mpv:native:windows

      # The DLL, the addon, the headers and the provenance the audit wrote.
      - name: 📤 Windows native resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-win32-x64-${{ inputs.sha }}
          path: libs/raven/mpv/resources/win32-x64
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the Windows native build.
  windows-app:
    name: 🏗️ Build Windows app
    needs: windows-native
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      # The PR's head commit, which the artifact is named for. The native job checks out
      # with no ref, so on a pull request its engine was built from the merge commit.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The DLL, the addon and their provenance, back where the native job built them.
      - name: 📥 Windows native resources
        uses: actions/download-artifact@v8
        with:
          name: raven-native-win32-x64-${{ inputs.sha }}
          path: libs/raven/mpv/resources/win32-x64

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      # Squirrel's setup exe and the portable zip, unsigned.
      - name: 📦 Make the unsigned installer
        run: bun run desktop:make

      # Every addon and DLL of the engine is x64, the addon loads only Windows, libmpv and
      # Node, and libmpv is the one the lock pins.
      - name: 🔎 Audit the packaged app
        run: bun run desktop:audit:bundle

      # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      # The unsigned installer and zip, for trying the PR's build by hand.
      - name: 📤 Unsigned Raven
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-win32-x64-${{ inputs.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The device app's and Wren's builds: the Release build for the device's simulator or emulator,
  # uploaded as an artifact for its end to end job. One job a device, each on its own runner,
  # since they share nothing but their steps, which the first job holds and the rest reuse. One
  # Release build of React Native takes up to an hour cold, its compile cached by ccache, and by
  # Gradle on Android; Nx Cloud's remote cache restores a build whose inputs a commit left alone.
  # Every flow in `apps/raven/app/e2e` but the remote's (`dpad`), each opening on the accountless
  # fixture's Home. The build runs `prebuild:ios` first (bun runs it before `build:ios`), which
  # regenerates ios/ and installs the pods; Nx caches only the app and the two lockfiles.
  build-iphone:
    name: 🏗️ Build iPhone
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env: &iphone-env
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # The run that holds the build and the commit it is named for, which the end to end job reads.
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: ios
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:ios --excludeTaskDependencies
      APP_ARTIFACT: raven-app-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Raven.app
      APP_SIMULATOR: raven-phone
      APP_SDK: iphonesimulator
      APP_RUNTIME: iOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      APP_DRIVER: maestro
      APP_FLOWS: bun run app:e2e
      APP_LOGS: raven-app-e2e-logs
    steps:
      &build-steps # The commit named, so the artifact names below match the commit that was built.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # Bun, Node, JDK 17 on Android (Gradle runs on it; the runner's Android SDK is
      # ANDROID_HOME already), the build caches restored from what app-caches.yml saved on
      # main, ffmpeg, ccache, the build environment (an x86_64-only APK on Android), the
      # install and the libraries (built once, so the app build below skips its own).
      - name: 🧰 Set up the app build
        uses: ./.github/actions/raven-app-setup
        with:
          platform: ${{ env.APP_SETUP }}
          node-version: ${{ env.APP_NODE_VERSION }}

      - name: 🏗️ Build
        run: ${{ env.APP_BUILD }}

      # How much of the compile ccache served, to tell a warm cache from a cold one.
      - name: 📊 ccache
        run: ccache --show-stats

      - name: 🔎 Check the project targets Apple TV
        if: env.APP_RUNTIME == 'tvOS'
        working-directory: ${{ env.APP_PROJECT }}/ios
        run: grep -q 'SDKROOT = appletvos' Raven.xcodeproj/project.pbxproj

      # `expo prebuild` exits 0 when `pod install` fails, so the pods are checked by hand:
      # CocoaPods writes Pods/Manifest.lock as a copy of Podfile.lock once it has installed.
      - name: 🔎 Check the pods
        if: env.APP_BUNDLE != ''
        working-directory: ${{ env.APP_PROJECT }}/ios
        run: cmp Podfile.lock Pods/Manifest.lock

      # The build zipped as Finder would, which keeps the execute bits an artifact drops,
      # so the unzipped app still launches.
      - name: 📦 Pack the simulator app
        if: env.APP_BUNDLE != ''
        working-directory: ${{ env.APP_PROJECT }}
        run: ditto -c -k --keepParent "${{ env.APP_BUNDLE }}" "$RUNNER_TEMP/simulator-app.zip"

      # The build, for the end to end job and for trying the PR's app by hand: the zipped
      # simulator app, or Gradle's Release APK, signed with the debug key Expo's template sets
      # up. The APK holds only x86_64 code, so it installs on an x86_64 emulator, not a device.
      - name: 📤 The build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT }}-${{ inputs.sha }}
          path: ${{ env.APP_BUNDLE != '' && format('{0}/simulator-app.zip', runner.temp) || format('{0}/android/app/build/outputs/apk/release', env.APP_PROJECT) }}
          if-no-files-found: error

      # What `e2e:tvos` reads beside the app, the build target's other Nx outputs: the Xcode
      # project, the remote test target, the pods' support files and the two lockfiles.
      - name: 📦 Pack the remote test project
        if: env.APP_DRIVER == 'xcuitest'
        working-directory: ${{ env.APP_PROJECT }}
        run: tar -czf "$RUNNER_TEMP/remote-test-project.tgz" ios/Podfile.lock ios/Pods/Manifest.lock 'ios/Pods/Target Support Files/Pods-raven' ios/Raven.xcodeproj ios/RavenRemoteTests

      - name: 📤 Remote test project
        if: env.APP_DRIVER == 'xcuitest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT }}-test-project-${{ inputs.sha }}
          path: ${{ runner.temp }}/remote-test-project.tgz
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The XCUITests the tvOS prebuild added (`tvos-e2e/`) open on Home, play the film, leave with
  # Menu and find it under Continue watching, all with the Siri Remote. The build runs
  # `prebuild:tvos` first; Nx caches only what the steps and the flow read: the app, the two
  # lockfiles, the Xcode project, the remote test target and the pods' support files. Pods/ and
  # DerivedData are left out, since they ran Nx Cloud's upload out of open files (EMFILE).
  build-apple-tv:
    name: 🏗️ Build Apple TV
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env: &apple-tv-env
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # The run that holds the build and the commit it is named for, which the end to end job reads.
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: tvos
      APP_PROJECT: apps/raven/app
      APP_BUILD: bun run ci:app:tvos:build
      APP_ARTIFACT: raven-app-tvos-simulator
      APP_BUNDLE: build/tvos/Build/Products/Release-appletvsimulator/Raven.app
      APP_SIMULATOR: raven-tv
      APP_SDK: appletvsimulator
      APP_RUNTIME: tvOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
      APP_DRIVER: xcuitest
      APP_FLOWS: bun run app:e2e:tvos
      APP_LOGS: raven-app-tvos-e2e-logs
    steps: *build-steps

  # Every flow the remote drives (`e2e:android-tv`, all but the touch ones), which first point the
  # emulator's 127.0.0.1:8490 at the runner's with `adb reverse`, so the app signs in to the address
  # the iPhone uses. The build runs `prebuild:android-tv` first, which regenerates android/ with the
  # leanback launcher, then Gradle's Release APK. Android builds on Linux (Ruling 20): GitHub's
  # macOS arm64 runners cannot run the Android emulator.
  build-android-tv:
    name: 🏗️ Build Android TV
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: &android-tv-env
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # The run that holds the build and the commit it is named for, which the end to end job reads.
      BUILD_RUN_ID: ${{ needs.select.outputs.app_run }}
      BUILD_SHA: ${{ needs.select.outputs.app_sha }}
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:android-tv --excludeTaskDependencies
      APP_ARTIFACT: raven-app-android-tv
      APP_BUNDLE: ''
      APP_DRIVER: maestro
      APP_FLOWS: bun run app:e2e:android-tv
      APP_LOGS: raven-app-android-tv-e2e-logs
    steps: *build-steps

  # No flows yet: the touch flows need a phone emulator of their own. The phone prebuild (no
  # leanback launcher, the music service kept) on the Android TV setup, its caches and its
  # x86_64-only build among them.
  build-android-phone:
    name: 🏗️ Build Android phone
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:android --excludeTaskDependencies
      APP_ARTIFACT: raven-app-android
      APP_BUNDLE: ''
    steps: *build-steps

  # Wren, raven's music app, built and tested by the device app's steps, since it builds on the
  # same React Native and pods. Every flow in `apps/raven/music/e2e`: open on Home, play the
  # fixture's album, and download it, on a simulator of Wren's own, as `ci:wren` makes one. No Wren
  # job carries the Nx Cloud token, so Nx caches on the runner only.
  build-wren-iphone:
    name: 🏗️ Build Wren iPhone
    needs: select
    if: needs.select.outputs.music_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      &wren-iphone-env # The run that holds the build and the commit it is named for, which the end to end job reads.
      BUILD_RUN_ID: ${{ needs.select.outputs.music_run }}
      BUILD_SHA: ${{ needs.select.outputs.music_sha }}
      APP_SETUP: ios
      APP_PROJECT: apps/raven/music
      APP_BUILD: bunx nx run @raven/music:build:ios --excludeTaskDependencies
      APP_ARTIFACT: raven-music-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Wren.app
      APP_SIMULATOR: wren-phone
      APP_SDK: iphonesimulator
      APP_RUNTIME: iOS
      APP_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      APP_DRIVER: maestro
      APP_FLOWS: bunx nx run @raven/music:e2e
      APP_LOGS: raven-music-e2e-logs
    steps: *build-steps

  # No flows yet.
  build-wren-android:
    name: 🏗️ Build Wren Android
    needs: select
    if: needs.select.outputs.music_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/music
      APP_BUILD: bunx nx run @raven/music:build:android --excludeTaskDependencies
      APP_ARTIFACT: raven-music-android
      APP_BUNDLE: ''
    steps: *build-steps

  # The flows of every device that has them, against a real raven server: Maestro on the iPhone
  # simulator and on an Android TV emulator, driven by the remote's keys, and an XCUITest that
  # drives the Apple TV with the Siri Remote. Only in the `e2e` stage, each on its own device's
  # build: the merged pull request's where the selection found it (its build job is then skipped),
  # else the one that job made in this run. A failed build skips its flows. Each timeout covers
  # the simulator's or emulator's boot and the flows, twice over when Maestro's driver is retried.
  e2e-iphone:
    name: 🎬 E2E iPhone
    needs: [select, build-iphone]
    if: ${{ !cancelled() && needs.select.outputs.app_e2e == 'true' && contains(fromJSON('["success", "skipped"]'), needs.build-iphone.result) }}
    runs-on: macos-26
    timeout-minutes: 45
    env: *iphone-env
    steps: &e2e-steps # The commit under test, whose flows run on the build.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The build job's setup without the compile's caches and the NDK: Bun, Node, JDK 17 on
      # Android (Maestro runs on it), ffmpeg, the build environment (an Nx input of the
      # flows), the install and the libraries the fixture server runs on.
      - name: 🧰 Set up the app tools
        uses: ./.github/actions/raven-app-setup
        with:
          platform: ${{ env.APP_SETUP }}
          node-version: ${{ env.APP_NODE_VERSION }}
          compiles: false

      # A real, accountless raven server with open film, series and music libraries, started
      # in the background while the tools and the build download. It prints its ready line
      # once its libraries are scanned.
      - name: 🗄️ Start the fixture server
        run: bunx nx run @raven/server:serve:fixture --excludeTaskDependencies > "$RUNNER_TEMP/fixture.log" 2>&1 &

      # Maestro's own release, the zip its Homebrew formula installs, pinned by version and
      # checksum. It runs on the runner's Java.
      - name: 🎭 Install Maestro
        if: env.APP_DRIVER == 'maestro'
        uses: ./.github/actions/raven-maestro

      # The zipped simulator app, or the APK back where the build job built it. The token
      # lets it read another run's artifact, the pull request's.
      - name: 📥 The build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT }}-${{ env.BUILD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.APP_BUNDLE != '' && runner.temp || format('{0}/android/app/build/outputs/apk/release', env.APP_PROJECT) }}

      # Back where the build job built it, with the execute bits the zip kept.
      - name: 📦 Unpack the simulator app
        if: env.APP_BUNDLE != ''
        working-directory: ${{ env.APP_PROJECT }}
        run: |
          products="$(dirname "${{ env.APP_BUNDLE }}")"
          mkdir -p "$products"
          ditto -x -k "$RUNNER_TEMP/simulator-app.zip" "$products"

      - name: 📥 Remote test project
        if: env.APP_DRIVER == 'xcuitest'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT }}-test-project-${{ env.BUILD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      # Back where the build job built it, which is where `e2e:tvos` reads it.
      - name: 📦 Unpack the remote test project
        if: env.APP_DRIVER == 'xcuitest'
        working-directory: ${{ env.APP_PROJECT }}
        run: tar -xzf "$RUNNER_TEMP/remote-test-project.tgz"

      # The Android TV emulator's settings and KVM, and the AVD with its booted snapshot,
      # restored from what app-caches.yml saved on main (a PR's own 2.7 GB copy would be its
      # alone), or made and booted once on a miss.
      - name: 📺 Android TV AVD
        if: env.APP_BUNDLE == ''
        id: avd
        uses: ./.github/actions/raven-android-avd

      # A fresh simulator on the runtime of the selected Xcode's SDK, booted, with the build
      # on it. A runner with no such runtime fails here rather than testing on another. A new
      # iPhone simulator shows the keyboard's slide to type tutorial the second time the
      # keyboard comes up, and it held the app's main thread for 30 s under the search flow,
      # so the simulator is told it has shown it.
      - name: 📱 Boot the simulator
        if: env.APP_BUNDLE != ''
        uses: ./.github/actions/raven-simulator
        with:
          sdk: ${{ env.APP_SDK }}
          runtime: ${{ env.APP_RUNTIME }}
          name: ${{ env.APP_SIMULATOR }}
          device-type: ${{ env.APP_DEVICE_TYPE }}
          app: ${{ env.APP_PROJECT }}/${{ env.APP_BUNDLE }}
          skip-keyboard-intro: ${{ env.APP_RUNTIME == 'iOS' }}

      - name: 🗄️ Wait for the fixture server
        uses: ./.github/actions/raven-fixture-ready

      # A fresh runner can start Maestro's XCTest driver slower than it waits by default, so
      # it waits five minutes (in milliseconds). A busy macOS runner can still miss even that,
      # before any flow runs, so a driver that never came up is retried once as a dead
      # screenshot service is.
      - name: 🎬 Flows on the simulator
        if: env.APP_BUNDLE != '' && env.APP_DRIVER == 'maestro'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: |
          set -o pipefail
          first="$RUNNER_TEMP/e2e-first.log"
          if ${{ env.APP_FLOWS }} 2>&1 | tee "$first"; then
            exit 0
          fi
          # Maestro's XCTest server dies on a screenshot timeout (upstream #3538).
          if grep -R -F -q 'Failed to get screenshot: Timed out while requesting screenshot.' "$HOME/.maestro/tests"; then
            echo '::warning::Maestro screenshot service timed out; rebooting the simulator and retrying once'
          elif grep -F -q 'iOS driver not ready in time' "$first"; then
            echo "::warning::Maestro's iOS driver did not start in time; rebooting the simulator and retrying once"
          else
            exit 1
          fi
          xcrun simctl shutdown "$APP_SIMULATOR"
          xcrun simctl boot "$APP_SIMULATOR"
          xcrun simctl bootstatus "$APP_SIMULATOR" -b
          ${{ env.APP_FLOWS }}

      # The screen the flow ends on goes up as an artifact.
      - name: 🎬 Flow with the Siri Remote
        if: env.APP_DRIVER == 'xcuitest'
        env:
          TVOS_SIMULATOR: ${{ env.APP_SIMULATOR }}
        run: |
          ${{ env.APP_FLOWS }}
          xcrun simctl io "$TVOS_SIMULATOR" screenshot "$RUNNER_TEMP/$TVOS_SIMULATOR.png"
          xcrun simctl shutdown "$TVOS_SIMULATOR"

      # Boots the AVD from its snapshot, installs the APK and runs the flows. The runner runs
      # each line of the script as its own command. Maestro's driver can start slower on a
      # fresh emulator than it waits by default, so it waits five minutes (in milliseconds).
      - name: 🎬 Flows on the emulator
        if: env.APP_BUNDLE == ''
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        with:
          api-level: ${{ steps.avd.outputs.api-level }}
          target: ${{ steps.avd.outputs.target }}
          arch: ${{ steps.avd.outputs.arch }}
          profile: ${{ steps.avd.outputs.profile }}
          emulator-build: ${{ steps.avd.outputs.emulator-build }}
          cores: ${{ steps.avd.outputs.cores }}
          ram-size: ${{ steps.avd.outputs.ram-size }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ steps.avd.outputs.emulator-options }}
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb install ${{ env.APP_PROJECT }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.APP_FLOWS }}

      # What the app and the system logged on the simulator, only when a step failed.
      - name: 🪵 Simulator log
        if: failure() && env.APP_BUNDLE != ''
        run: xcrun simctl spawn "$APP_SIMULATOR" log show --last 30m --style compact --predicate "process == \"$(basename "$APP_BUNDLE" .app)\"" > "$RUNNER_TEMP/simulator.log" || true

      # Maestro's screenshots and logs or the XCUITest's, the simulator's log and the fixture
      # server's, only when a step failed.
      - name: 📤 End to end logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_LOGS }}-${{ inputs.sha }}
          path: |
            ~/.maestro/tests
            ${{ env.APP_PROJECT }}/build/tvos-e2e/Logs/Test
            ${{ runner.temp }}/fixture.log
            ${{ runner.temp }}/simulator.log
          if-no-files-found: ignore

      # The screen the Siri Remote's flow ended on.
      - name: 📤 End to end screen
        if: env.APP_DRIVER == 'xcuitest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_LOGS }}-screen-${{ inputs.sha }}
          path: ${{ runner.temp }}/${{ env.APP_SIMULATOR }}.png
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  e2e-apple-tv:
    name: 🎬 E2E Apple TV
    needs: [select, build-apple-tv]
    if: ${{ !cancelled() && needs.select.outputs.app_e2e == 'true' && contains(fromJSON('["success", "skipped"]'), needs.build-apple-tv.result) }}
    runs-on: macos-26
    timeout-minutes: 30
    env: *apple-tv-env
    steps: *e2e-steps

  e2e-android-tv:
    name: 🎬 E2E Android TV
    needs: [select, build-android-tv]
    if: ${{ !cancelled() && needs.select.outputs.app_e2e == 'true' && contains(fromJSON('["success", "skipped"]'), needs.build-android-tv.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: *android-tv-env
    steps: *e2e-steps

  e2e-wren-iphone:
    name: 🎬 E2E Wren iPhone
    needs: [select, build-wren-iphone]
    if: ${{ !cancelled() && needs.select.outputs.music_e2e == 'true' && contains(fromJSON('["success", "skipped"]'), needs.build-wren-iphone.result) }}
    runs-on: macos-26
    timeout-minutes: 45
    env: *wren-iphone-env
    steps: *e2e-steps

  # One native build feeds packaging and both playback checks through an artifact.
  desktop-native:
    name: 🏗️ Build Mac native
    needs: select
    if: needs.select.outputs.desktop_build == 'true'
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # Shared with desktop-release.yml so a release builds as this does.
      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # A tar keeps ffmpeg's execute bit, which an artifact drops.
      - name: 📦 Pack the playback handoff
        run: >-
          tar -cf "$RUNNER_TEMP/raven-native-handoff.tar"
          libs/raven/mpv/resources/darwin-arm64
          libs/raven/mpv/native-build/prefix/bin/ffmpeg

      # The jobs below read it, and so does 🎬 E2E Mac on main once the pull request merges,
      # which can be weeks after it was built.
      - name: 📤 Playback handoff
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-handoff-${{ inputs.sha }}
          path: ${{ runner.temp }}/raven-native-handoff.tar
          if-no-files-found: error
          retention-days: 30
          # A re-run of this job replaces the handoff its first attempt left.
          overwrite: true

      # Both only read the built resources, so Nx runs them at once.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bun run mpv:native

      - name: 📤 Native playback resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-darwin-arm64-${{ inputs.sha }}
          path: libs/raven/mpv/resources/darwin-arm64
          if-no-files-found: error

      # mpv's GPL and FFmpeg's LGPL want the matching source beside the binaries.
      - name: 📤 Matching native sources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-sources-${{ inputs.sha }}
          path: libs/raven/mpv/native-build/source-bundle
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the native build.
  desktop-app:
    name: 🏗️ Build Mac app
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # The same Xcode as the native job, for the tools the make and the audit run.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 📥 Native handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ inputs.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the native handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      - name: 📦 Make the unsigned app
        run: bun run desktop:make

      # otool, lipo and codesign over every Mach-O file in the app.
      - name: 🔎 Audit the packaged bundle
        run: bun run desktop:audit:bundle

      # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      - name: 📤 Unsigned Raven
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-darwin-arm64-${{ inputs.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The desktop player against headless libmpv, wherever this run built the native pieces: a
  # pull request's, or a push to main that found no build to reuse.
  desktop-test:
    name: 🧪 Test Mac player
    needs: [select, desktop-native]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached results are keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The source-built ffmpeg encodes the test clips; `clips.ts` passes `-allow_sw 1`, so
      # VideoToolbox falls back to its software H.264 encoder on a VM.
      RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg
      # The run that holds the native pieces and the commit they are named for.
      BUILD_RUN_ID: ${{ needs.select.outputs.desktop_run }}
      BUILD_SHA: ${{ needs.select.outputs.desktop_sha }}
      CHECK_NAME: 🧪 Test Mac player
      CHECK_TARGET: test:native
    steps: &playback-steps
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The token lets it read another run's artifact, the pull request's.
      - name: 📥 Playback handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ env.BUILD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      - name: 📂 Unpack the playback handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Cached on the desktop and native sources and the Xcode version.
      - name: ${{ env.CHECK_NAME }}
        run: bun run desktop:${{ env.CHECK_TARGET }}

      - name: 📤 End to end traces
        if: failure() && env.CHECK_TARGET == 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ inputs.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Raven's Playwright suite, in the `e2e` stage only, on the merged pull request's native pieces
  # where the selection found them (desktop-native is then skipped), else on the ones it built in
  # this run. It runs `electron .`, never the packaged app, whose fuses turn off the inspector
  # Playwright needs. The target's `install:electron` step fetches the binary.
  desktop-e2e:
    name: 🎬 E2E Mac
    needs: [select, desktop-native]
    if: ${{ !cancelled() && needs.select.outputs.desktop_e2e == 'true' && contains(fromJSON('["success", "skipped"]'), needs.desktop-native.result) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached results are keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The source-built ffmpeg encodes the test clips; `clips.ts` passes `-allow_sw 1`, so
      # VideoToolbox falls back to its software H.264 encoder on a VM.
      RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg
      # The run that holds the native pieces and the commit they are named for.
      BUILD_RUN_ID: ${{ needs.select.outputs.desktop_run }}
      BUILD_SHA: ${{ needs.select.outputs.desktop_sha }}
      CHECK_NAME: 🎬 E2E Mac
      CHECK_TARGET: e2e
    steps: *playback-steps
