name: 🖥️ Desktop release

# Builds Raven for macOS arm64 and Windows x64 and attaches both to the release of each
# pushed vX.Y.Z tag (scripts/bump_version.sh --push): the dmg and the setup exe, the two
# zips, the libmpv sources tarball and one SHA256SUMS over all of them. release.yml still creates that release from the commit log;
# this workflow waits for it, uploads the assets with --clobber (a re-run replaces
# them) and appends the install notes once, then `homebrew` points the Raven cask in
# maester-tv/homebrew-tap at the new dmg. Only three-number tags run it, so a
# vX.Y.Z.N build tag never builds the app.
#
# A run from the Actions tab is the dry run: it builds and uploads the assets as
# an artifact, and never publishes. This workflow never runs on a pull request;
# pull-request-checks.yml builds the app there.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🖥️ Build Raven for macOS arm64
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    # Room for the libmpv source build, which runs cold whenever Nx Cloud holds no result
    # for its inputs.
    timeout-minutes: 150
    env:
      # Nx Cloud's remote cache, which restores the libmpv source build a run on the same
      # inputs already did. Unset, every run builds it from source.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keep this release build separate from PR checks on the same branch in Nx Cloud.
      NX_BRANCH: desktop-release-${{ github.head_ref || github.ref_name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Fails before the long build when the tag and the app disagree on the version.
      - name: 🏷️ Check the tag
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .version apps/raven/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME is not v$version, the version in apps/raven/desktop/package.json."
            exit 1
          fi

      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # Both only read the built resources, so Nx runs them at once.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bunx nx run-many -p @raven/mpv -t audit:native test:native

      # Sets RAVEN_SIGN_IDENTITY and RAVEN_NOTARIZE_PROFILE when the Developer ID secrets
      # exist: make then signs and notarizes, and audit:bundle asks Gatekeeper for its
      # verdict. Without them (until the certificate exists, or on a fork), the app stays
      # signed ad hoc.
      - name: 🔏 Set up Developer ID signing and notarization
        uses: ./.github/actions/raven-desktop-signing
        with:
          developer-id-p12: ${{ secrets.RAVEN_DEVELOPER_ID_P12 }}
          developer-id-p12-password: ${{ secrets.RAVEN_DEVELOPER_ID_P12_PASSWORD }}
          notary-key: ${{ secrets.RAVEN_NOTARY_KEY }}
          notary-key-id: ${{ secrets.RAVEN_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.RAVEN_NOTARY_ISSUER_ID }}

      - name: 📦 Make the app
        run: bunx nx run @raven/desktop:make

      - name: 🔎 Audit the packaged bundle
        run: bunx nx run @raven/desktop:audit:bundle

      - name: 🚬 Smoke the packaged app
        run: bunx nx run @raven/desktop:smoke:packaged

      - name: 🗂️ Gather the release assets
        run: bunx nx run @raven/desktop:release:assets

      - name: 📤 Raven release assets
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-release-darwin-arm64-${{ github.sha }}
          path: apps/raven/desktop/out/release
          if-no-files-found: error

  build-windows:
    name: 🪟 Build Raven for Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_BRANCH: desktop-release-${{ github.head_ref || github.ref_name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🏷️ Check the tag
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .version apps/raven/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME is not v$version, the version in apps/raven/desktop/package.json."
            exit 1
          fi

      # Shared with the raven-windows-native action so a release builds as the checks do.
      - name: 🔩 Fetch libmpv, build the addon, audit and test them
        uses: ./.github/actions/raven-windows-mpv

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      - name: 📦 Make the unsigned installer
        run: bun run desktop:make

      - name: 🔎 Audit the packaged app
        run: bun run desktop:audit:bundle

      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      - name: 🗂️ Gather the release assets
        run: bun run desktop:release:assets

      - name: 📤 Raven release assets
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-release-win32-x64-${{ github.sha }}
          path: apps/raven/desktop/out/release
          if-no-files-found: error

  publish:
    name: 🏷️ Attach Raven to the release
    needs: [build, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Uploading assets and editing the notes write to the repo; nothing else here does.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    outputs:
      dmg-sha256: ${{ steps.checksums.outputs.dmg-sha256 }}
    steps:
      # For the install notes file.
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download the macOS release assets
        uses: actions/download-artifact@v8
        with:
          name: raven-player-release-darwin-arm64-${{ github.sha }}
          path: release

      - name: 📥 Download the Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: raven-player-release-win32-x64-${{ github.sha }}
          path: release

      # One file for the whole release, so it is written here over every asset and never
      # by a build, whose own SHA256SUMS would collide with the other's. The dmg's line is
      # also the digest the Homebrew cask pins, so the cask and the release never disagree.
      - name: 🔐 Checksum the assets
        id: checksums
        run: |
          set -euo pipefail
          (cd release && LC_ALL=C sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
          cat release/SHA256SUMS
          dmg_sha256=$(awk -v dmg="raven-player-${TAG#v}-arm64.dmg" '$2 == dmg { print $1 }' release/SHA256SUMS)
          if [ -z "$dmg_sha256" ]; then
            echo "::error::SHA256SUMS has no line for the dmg."
            exit 1
          fi
          echo "dmg-sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"

      # release.yml makes the release from the same tag push, and may not be done yet.
      - name: ⏳ Wait for the release
        uses: ./.github/actions/wait-for-release
        with:
          tag: ${{ env.TAG }}

      - name: 📤 Upload the assets
        run: gh release upload "$TAG" release/* --clobber

      # Only once: a re-run finds the heading already in the notes and leaves them.
      - name: 📝 Append the install notes
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if tr -d '\r' <<< "$body" | grep -qx '## Installing Raven'; then
            echo "$TAG's notes already say how to install Raven."
            exit 0
          fi
          {
            printf '%s\n' "$body"
            echo
            # The notes name the assets by version; the tag is v plus that version.
            sed "s/<version>/${TAG#v}/g" apps/raven/desktop/release/install-notes.md
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  homebrew:
    name: 🍺 Bump the Homebrew cask
    needs: publish
    # A prerelease tag (vX.Y.Z-rc.1) stays out of the cask, which every brew upgrade reads.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      DMG_SHA256: ${{ needs.publish.outputs.dmg-sha256 }}
    steps:
      # The deploy key writes to maester-tv/homebrew-tap alone; GITHUB_TOKEN reaches only this repo.
      - name: 📥 Checkout the tap
        uses: actions/checkout@v7
        with:
          repository: maester-tv/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      # A re-run on the same tag finds the cask already there and pushes nothing.
      - name: 🍺 Point the cask at this release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cask=tap/Casks/raven.rb
          sed -i -E \
            -e "s/^  version \"[^\"]+\"$/  version \"$version\"/" \
            -e "s/^  sha256 \"[0-9a-f]+\"$/  sha256 \"$DMG_SHA256\"/" \
            "$cask"
          grep -qx "  version \"$version\"" "$cask"
          grep -qx "  sha256 \"$DMG_SHA256\"" "$cask"
          cd tap
          if git diff --quiet; then
            echo "The cask is already at $version."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Raven $version"
          git push
