name: 🖥️ Desktop release

# Builds Raven for macOS arm64 and Windows x64 and attaches both to the release of each
# pushed vX.Y.Z tag (scripts/bump_version.sh --push): the dmg and the setup exe, the two
# zips, the libmpv sources tarball and one SHA256SUMS over all of them. release.yml still creates that release from the commit log;
# this workflow waits for it, uploads the assets with --clobber (a re-run replaces
# them) and appends the install notes once. Only three-number tags run it, so a
# vX.Y.Z.N build tag never builds the app.
#
# A pull request that touches the release's own files, or a run from the Actions
# tab, is the dry run: it builds and uploads the assets as an artifact, and never
# publishes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop-release.yml
      - .github/actions/raven-desktop-native/**
      - apps/raven/desktop/forge.config.ts
      - apps/raven/desktop/src/build/**
      - apps/raven/desktop/release/**

permissions:
  contents: read

# A newer push to a PR cancels its dry run; a tag's run always finishes.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 🖥️ Build Raven for macOS arm64
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    # Room for a cold libmpv source build when no cache holds it.
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # Only this job runs Nx. Nx Cloud's remote cache restores the libmpv source build a
      # run on the same inputs already did; unset (no secret, a fork's PR), nothing does.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keep this release build separate from PR checks on the same branch in Nx Cloud.
      NX_BRANCH: desktop-release-${{ github.head_ref || github.ref_name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Fails before the long build when the tag and the app disagree on the version.
      - name: 🏷️ Check the tag
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .version apps/raven/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME is not v$version, the version in apps/raven/desktop/package.json."
            exit 1
          fi

      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # Both only read the built resources, so Nx runs them at once.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bunx nx run-many -p @raven/mpv -t audit:native test:native

      - name: 📦 Make the unsigned app
        run: bunx nx run @raven/desktop:make

      - name: 🔎 Audit the packaged bundle
        run: bunx nx run @raven/desktop:audit:bundle

      - name: 🚬 Smoke the packaged app
        run: bunx nx run @raven/desktop:smoke:packaged

      - name: 🗂️ Gather the release assets
        run: bunx nx run @raven/desktop:release:assets

      - name: 📤 Raven release assets
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-release-darwin-arm64-${{ github.sha }}
          path: apps/raven/desktop/out/release
          if-no-files-found: error

  build-windows:
    name: 🪟 Build Raven for Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_BRANCH: desktop-release-${{ github.head_ref || github.ref_name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🏷️ Check the tag
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .version apps/raven/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME is not v$version, the version in apps/raven/desktop/package.json."
            exit 1
          fi

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # MSVC's compiler and lib.exe on PATH; the addon builds with Ninja against them.
      - name: 🛠️ Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The native tests make their clips with ffmpeg; the image has none. Keep these two
      # values the same as the `🪟 Windows native` job's in pull-request-checks.yml.
      - name: 🎞️ Install ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-8.1.zip
          FFMPEG_SHA256: 4a7642b2264c03e8a0ce8a3825b933ee5580656f45695a086fe7e294045ffc0a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.zip"
          curl -fsSL -o "$archive" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ffmpeg"
          bin="$(dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe | head -n 1)")"
          "$bin/ffmpeg.exe" -version | head -n 1
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: 🔩 Fetch libmpv, build the addon, audit and test them
        run: bun run mpv:native:windows

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      - name: 📦 Make the unsigned installer
        run: bun run desktop:make

      - name: 🔎 Audit the packaged app
        run: bun run desktop:audit:bundle

      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      - name: 🗂️ Gather the release assets
        run: bun run desktop:release:assets

      - name: 📤 Raven release assets
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-release-win32-x64-${{ github.sha }}
          path: apps/raven/desktop/out/release
          if-no-files-found: error

  publish:
    name: 🏷️ Attach Raven to the release
    needs: [build, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Uploading assets and editing the notes write to the repo; nothing else here does.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # For the install notes file.
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download the macOS release assets
        uses: actions/download-artifact@v8
        with:
          name: raven-player-release-darwin-arm64-${{ github.sha }}
          path: release

      - name: 📥 Download the Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: raven-player-release-win32-x64-${{ github.sha }}
          path: release

      # One file for the whole release, so it is written here over every asset and never
      # by a build, whose own SHA256SUMS would collide with the other's.
      - name: 🔐 Checksum the assets
        run: |
          set -euo pipefail
          (cd release && LC_ALL=C sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
          cat release/SHA256SUMS

      # release.yml makes the release from the same tag push, and may not be done yet.
      - name: ⏳ Wait for the release
        run: |
          tries=1
          until gh release view "$TAG" > /dev/null 2>&1; do
            if [ "$tries" -ge 30 ]; then
              echo "::error::$TAG still has no release after 30 tries; release.yml makes it."
              exit 1
            fi
            echo "$TAG has no release yet (try $tries of 30); waiting 20 s."
            tries=$((tries + 1))
            sleep 20
          done

      - name: 📤 Upload the assets
        run: gh release upload "$TAG" release/* --clobber

      # Only once: a re-run finds the heading already in the notes and leaves them.
      - name: 📝 Append the install notes
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if tr -d '\r' <<< "$body" | grep -qx '## Installing Raven'; then
            echo "$TAG's notes already say how to install Raven."
            exit 0
          fi
          {
            printf '%s\n' "$body"
            echo
            # The notes name the assets by version; the tag is v plus that version.
            sed "s/<version>/${TAG#v}/g" apps/raven/desktop/release/install-notes.md
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
