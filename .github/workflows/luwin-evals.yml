name: 🧠 Luwin evals

# Weekly, and on demand from the Actions tab. The evals run luwin's agent with
# the real model against fake services, so they take about five minutes and
# spend Anthropic credits. They stay out of the pull request checks for that
# reason. A failed run emails whoever last touched the schedule.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  evals:
    name: 🧠 Evals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # `apps/luwin/api/.python-version` picks the interpreter.
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🔑 Require the API key
        run: test -n "$ANTHROPIC_API_KEY" || { echo "Add the ANTHROPIC_API_KEY repository secret."; exit 1; }

      - name: 🧠 Run the evals
        run: bunx nx run @luwin/api:eval --skip-nx-cache
