name: 🧪 Pull request checks

# Every pull request, into any base branch: runs when it opens or reopens and
# on each push to its branch. Each check runs on the projects the PR affects (a
# change to this workflow runs every check on every project), then the production
# images are built and health checked. The device app, Wren and Windows jobs are the
# slow ones: they run here only when the PR changes what the native compile reads
# (native-checks.yml), and on every merge to main otherwise (main-native-checks.yml).
# Merges to main are also covered by main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

env:
  # raven's device app loads babel.config.ts through Node's own type stripping, which
  # needs Node 22.18 or newer, wherever Metro or jest-expo runs.
  APP_NODE_VERSION: 24.21.0

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks `bun run verify` runs before the build, one target per runner so
  # they execute in parallel and each has its own named log. Nx Cloud still shares
  # completed tasks between jobs through its remote cache.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    strategy:
      # The cancel step below ends the whole run on the first failure, in any job.
      fail-fast: true
      # Nx Cloud bills the peak number of jobs connected at once beyond the 10 included, so
      # the matrix leaves room for the Supabase and desktop jobs that run beside it.
      max-parallel: 5
      matrix:
        check:
          - name: 🎨 Format
            target: format:check
            uv: true
          - name: 🧩 Type-check
            target: typecheck
          - name: 🔤 Spellcheck
            target: spellcheck
            uv: true
          - name: 🐍 Python lint
            target: lint:py
            uv: true
          - name: 🟦 TypeScript lint
            target: lint:ts
          - name: 🖌️ CSS lint
            target: lint:css
          - name: 🧪 Tests
            target: test
            ffmpeg: true
            uv: true
          - name: 📸 Screen tests
            target: test:screens
            node: true
          - name: 🧹 Dead code
            target: dead-code
          - name: 🧼 Dead CSS
            target: dead-css
    env:
      # Nx Cloud's remote cache: a task any job or earlier run already did, on the same
      # inputs, restores instead of running. Nx Cloud also groups the runs of a workflow run
      # under one CI pipeline execution, which it bills, so only the jobs a cache hit saves
      # real time in carry the token. Not `nx start-ci-run --no-distribution`: Nx Cloud
      # rejects it outside its Enterprise plan. Unset (a fork's PR), Nx caches locally only
      # and records nothing.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      # The PR's merge commit with its base, which is what lands if it merges. The whole
      # history, so Nx can find what the PR changed against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # raven's screen tests load babel.config.ts through Node's type stripping.
      - name: 🟩 Set up Node
        if: matrix.check.node == true
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      # Python checks use each project's pinned interpreter and lockfile.
      - name: 🐍 Set up uv
        if: matrix.check.uv == true
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      # Pin a month-end build (kept for two years); daily builds expire after 14 builds.
      # The pinned build keeps raven's encoded test cues stable across runner images.
      - name: 🎞️ Install test system tools
        if: matrix.check.ffmpeg == true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          build=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          curl -fsSL -o "/tmp/$build.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$build.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  /tmp/$build.tar.xz" | sha256sum -c -
          tar -xf "/tmp/$build.tar.xz" -C /tmp
          sudo install -m 755 "/tmp/$build/bin/ffmpeg" "/tmp/$build/bin/ffprobe" /usr/local/bin/
          ffmpeg -version | head -n 1

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # `static` keeps every test's output; Nx's CI default collapses passing tasks. A change
      # to this workflow touches only the root project, so it runs the check on everything.
      - name: ${{ matrix.check.name }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TARGET: ${{ matrix.check.target }}
        run: |
          if git diff --quiet "$BASE" HEAD -- .github/workflows/pull-request-checks.yml; then
            bunx nx affected --outputStyle=static --base="$BASE" --head=HEAD -t "$TARGET"
          else
            bunx nx run-many --outputStyle=static -t "$TARGET"
          fi

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Keep the existing order: every matrix check finishes, then every project builds.
  build:
    name: 🏗️ Build
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🏗️ Build
        run: bun run build

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The "Protect main" ruleset requires this stable check name. It passes only
  # when every matrix check and the build passed.
  checks-complete:
    name: ✅ Checks
    needs: [checks, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ✅ Every check passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Checks: $CHECKS_RESULT"
          echo "Build: $BUILD_RESULT"
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success

  supabase:
    name: 🗄️ Supabase
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 15
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - name: Type-check Edge Functions
        run: bunx nx run @raven/supabase:check:functions
      - name: Test Edge Functions
        run: bunx nx run @raven/supabase:test:functions
      # No Mailpit: the checks send no mail, and its port 54324 sits in the runner's
      # ephemeral range, where a stray connection can hold it and fail the bind.
      - name: Start local auth and database
        run: bunx nx run @raven/supabase:db:start:ci
      - name: Test membership authorization
        run: bunx nx run @raven/supabase:test:db
      - name: Lint database
        run: bunx nx run @raven/supabase:lint:db
      - name: Stop local stack
        if: always()
        run: bunx nx run @raven/supabase:db:stop

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # One native build feeds the other desktop jobs, handed over as an artifact: the app
  # job packages its addon and dylibs, and the two playback checks load them side by side.
  desktop-native:
    name: 🎞️ Desktop native
    needs: app-affected
    if: needs.app-affected.outputs.desktop == 'true'
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    timeout-minutes: 120
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      # The PR's head commit, not the merge commit, so the artifact names below match
      # the commit that was built.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun, the toolchain, the install, the cached libmpv build and the addon, shared
      # with desktop-release.yml so a release builds as this does.
      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # What the app and playback jobs load: the addon and its dylibs, and the source-built
      # ffmpeg that makes the playback clips. A tar keeps ffmpeg's execute bit, which an
      # artifact drops. Packed and uploaded before the audit below, so the jobs that load it
      # start while the audit runs; this job still has to pass for the gate to.
      - name: 📦 Pack the playback handoff
        run: >-
          tar -cf "$RUNNER_TEMP/raven-native-handoff.tar"
          libs/raven/mpv/resources/darwin-arm64
          libs/raven/mpv/native-build/prefix/bin/ffmpeg

      # Only the jobs below read it, so it lives for a day.
      - name: 📤 Playback handoff
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/raven-native-handoff.tar
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the handoff its first attempt left.
          overwrite: true

      # Both only read the built resources, so Nx runs them at once. test:native is
      # cached, keyed on the native sources, the build recipe and the Xcode version.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bun run mpv:native

      # The addon, its two dylibs and their license notices, as built for this commit.
      - name: 📤 Native playback resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/resources/darwin-arm64
          if-no-files-found: error

      # Every pinned upstream archive, both patches, the build scripts and the exact
      # revision those binaries came from: mpv's GPL and FFmpeg's LGPL want the source
      # beside the binaries.
      - name: 📤 Matching native sources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-sources-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/native-build/source-bundle
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the native build.
  desktop-app:
    name: 📦 Desktop app
    needs: desktop-native
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached app is keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # The same head commit the native job built, so its handoff matches these sources.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The tar the native job packed, into the runner's temp folder.
      - name: 📥 Native handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the native handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      # Cached on the app's and the native sources, the Xcode version and the signing
      # environment, so an unchanged app restores from Nx Cloud.
      - name: 📦 Make the unsigned app
        run: bun run desktop:make

      # otool, lipo and codesign over every Mach-O file in the app: its architectures,
      # links, rpaths and signature.
      - name: 🔎 Audit the packaged bundle
        run: bun run desktop:audit:bundle

      # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      # The unsigned app, for trying the PR's build by hand.
      - name: 📤 Unsigned Raven
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  desktop-playback:
    name: ${{ matrix.check.name }}
    needs: desktop-native
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: 🧪 Desktop player against headless libmpv
            target: test:native
          # Runs `electron .`, never the packaged app, whose fuses turn off the inspector
          # Playwright needs; the runner's logged-in GUI session shows the window. Electron 44
          # has no postinstall, so the target's `install:electron` step fetches the binary.
          - name: 🎬 Desktop end to end
            target: e2e
            traces: true
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Keeps the Xcode version the cached results are keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The source-built ffmpeg has VideoToolbox; `-allow_sw 1` falls back to Apple's
      # software H.264 encoder on a VM without a hardware one.
      RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg
    steps:
      # The same head commit the native job built, so its handoff matches these sources.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The tar the native job packed, into the runner's temp folder.
      - name: 📥 Playback handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the playback handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Cached on the desktop and native sources and the Xcode version, so a PR that
      # changes neither restores the result from Nx Cloud. Each matrix target has a
      # `desktop:` root script of the same name.
      - name: ${{ matrix.check.name }}
        run: bun run desktop:${{ matrix.check.target }}

      # Playwright's traces, only when a check failed, to replay what went wrong.
      - name: 📤 End to end traces
        if: failure() && matrix.check.traces
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # What this PR touches, for the jobs that build natively. The desktop player (`desktop`)
  # runs when @raven/desktop or its @raven/mpv addon is affected, or this workflow or the
  # native build's action changed. The device app (`app`), Wren (`music`) and the Windows
  # installer (`windows`) take 12 to 25 minutes, so a PR waits for them only when it changes
  # something their compile reads: a dependency, the app config, a config plugin, a local
  # native module, the flows, or the setup actions. Everything else about them runs on main
  # (main-native-checks.yml). The 🖥️ Desktop gate takes a skip as a pass.
  app-affected:
    name: 🔍 App affected
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 10
    outputs:
      app: ${{ steps.affected.outputs.app }}
      music: ${{ steps.affected.outputs.music }}
      windows: ${{ steps.affected.outputs.windows }}
      desktop: ${{ steps.affected.outputs.desktop }}
    steps:
      # The PR's head with its whole history, so Nx can find the merge base with the base.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Nx reads the project graph from the installed workspace.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🔍 Is the app affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          projects="$(bunx nx show projects --affected --base="$BASE" --head="$HEAD" --json)"
          echo "Affected: $projects"
          # Anything but a list of names fails the job here, rather than reading as no app.
          echo "$projects" | jq -e 'type == "array" and all(type == "string")' > /dev/null
          affects() { echo "$projects" | jq -e --arg name "$1" 'index($name) != null' > /dev/null; }
          # Not `git diff | grep -q`: grep quitting early can fail the pipe under pipefail.
          changed() { [ -n "$(git diff --name-only "$BASE...$HEAD" -- "$@")" ]; }
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          verdict() { if "$@"; then echo true; else echo false; fi; }

          workflow_changed() { changed .github/workflows/pull-request-checks.yml .github/workflows/native-checks.yml; }
          app_compile_changed() { changed bun.lock apps/raven/app/package.json apps/raven/app/app.config.ts apps/raven/app/plugins apps/raven/app/modules apps/raven/app/e2e apps/raven/app/tvos-e2e libs/raven/audio/android libs/raven/audio/ios libs/raven/audio/expo-module.config.json libs/raven/audio/package.json .github/actions/raven-app-setup .github/actions/raven-android-avd; }
          music_compile_changed() { changed bun.lock apps/raven/music/package.json apps/raven/music/app.config.ts apps/raven/music/plugins apps/raven/music/e2e libs/raven/audio/android libs/raven/audio/ios libs/raven/audio/expo-module.config.json libs/raven/audio/package.json .github/actions/raven-app-setup .github/actions/raven-android-avd; }
          windows_compile_changed() { changed bun.lock libs/raven/mpv/native libs/raven/mpv/package.json apps/raven/desktop/forge.config.ts apps/raven/desktop/package.json apps/raven/desktop/resources; }
          desktop_changed() { affects @raven/desktop || affects @raven/mpv || changed .github/workflows/pull-request-checks.yml .github/actions/raven-desktop-native; }
          app() { workflow_changed || { { affects @raven/app || affects @raven/server; } && app_compile_changed; }; }
          music() { workflow_changed || { { affects @raven/music || affects @raven/server; } && music_compile_changed; }; }
          windows() { workflow_changed || windows_compile_changed; }

          emit app "$(verdict app)"
          emit music "$(verdict music)"
          emit windows "$(verdict windows)"
          emit desktop "$(verdict desktop_changed)"

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job.
      - name: 🛑 Cancel the run
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The device app, Wren and the Windows installer, built by the shared workflow only when
  # this PR changes what their compile reads (app-affected). Their other runs are on main.
  native:
    name: 🧱 Native apps
    permissions:
      actions: write
      contents: read
    needs: app-affected
    if: needs.app-affected.outputs.app == 'true' || needs.app-affected.outputs.music == 'true' || needs.app-affected.outputs.windows == 'true'
    uses: ./.github/workflows/native-checks.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      app: ${{ needs.app-affected.outputs.app == 'true' }}
      music: ${{ needs.app-affected.outputs.music == 'true' }}
      windows: ${{ needs.app-affected.outputs.windows == 'true' }}
    secrets: inherit

  # The "Protect main" ruleset requires a check named 🖥️ Desktop, so this one stands
  # for every desktop, device app, Wren and Windows job and passes only when all of them
  # did. Any of them but app-affected may also be skipped, when the PR leaves them alone
  # (app-affected); a job that failed fails the gate through its own result.
  desktop:
    name: 🖥️ Desktop
    needs: [desktop-native, desktop-app, desktop-playback, app-affected, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Prints each needed job's result, then fails on the first that isn't a success, or
      # for the others a skip.
      - name: ✅ Every desktop job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REQUIRED: ${{ needs.app-affected.result }}
          APP_RESULTS: >-
            ${{ needs.desktop-native.result }} ${{ needs.desktop-app.result }}
            ${{ needs.desktop-playback.result }} ${{ needs.native.result }}
        run: |
          echo "$RESULTS"
          for result in $REQUIRED; do
            test "$result" = success
          done
          for result in $APP_RESULTS; do
            test "$result" = success || test "$result" = skipped
          done

  # The production images, built and health checked by the shared smoke workflow.
  smoke:
    name: 🐳 Smoke test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/smoke-test.yml
