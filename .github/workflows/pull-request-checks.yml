name: 🧪 Pull request checks

# Pull requests only, into any base branch. Merges to main are covered by
# main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 🚦 Lint, test and build
    runs-on: ubuntu-latest
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      # Full history so Nx can diff against the base branch.
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Each Python project's .python-version picks its interpreter.
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🧭 Base and head for affected
        uses: nrwl/nx-set-shas@v5

      # Lint, format, typecheck, test and build every project the PR touches.
      - name: 🚦 Affected targets
        run: bun run affected
