name: 🧪 Pull request checks

# Every pull request, into any base branch: runs when it opens or reopens and
# on each push to its branch. Every check in the repo runs against every
# project, not just the affected ones, then the production images are built
# and health checked. Merges to main are covered by main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, each running the root script you would run locally, so
  # the PR lists them separately and `bun run verify` stays the same set.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # A failing check doesn't cancel the rest, so one run reports them all.
      fail-fast: false
      matrix:
        check:
          # typos over the whole repo, dotfiles included.
          - name: 🔤 Spellcheck
            run: bun run spellcheck
          # No tracked .js, .jsx, .mjs or .cjs file anywhere.
          - name: 🟦 TypeScript only
            run: bun run typescript-only
          # No package.json script chained with `&&`, `||` or `;`.
          - name: 🧩 One command per script
            run: bun run one-command-per-script
          # ruff, oxlint and stylelint.
          - name: 🧹 Lint
            run: bun run lint
          # ruff format, and oxfmt for each project and the root files.
          - name: 🎨 Format check
            run: bun run format:check
          - name: 🔎 Typecheck
            run: bun run typecheck
          # pytest, vitest and bun test. raven's server and core tests encode
          # real clips with ffmpeg.
          - name: 🧪 Unit tests
            run: bun run test
            ffmpeg: true
          - name: 🏗️ Build
            run: bun run build
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Each Python project's .python-version picks its interpreter.
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: 🎞️ Install ffmpeg
        if: matrix.check.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  smoke:
    name: 🐳 Smoke test
    uses: ./.github/workflows/smoke-test.yml
