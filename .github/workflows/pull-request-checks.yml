name: 🧪 Pull request checks

# Every pull request, into any base branch: runs when it opens or reopens and
# on each push to its branch. Every check in the repo runs against every
# project, not just the affected ones, then the production images are built
# and health checked. Merges to main are covered by main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

env:
  # Nx Cloud's remote cache: a task any job or earlier run already did, on the same
  # inputs, restores instead of running. Unset (a fork's PR), Nx caches locally only.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # raven's device app loads babel.config.ts through Node's own type stripping, which
  # needs Node 22.18 or newer, wherever Metro or jest-expo runs.
  APP_NODE_VERSION: 24.21.0

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks `bun run verify` runs, one step each so the log shows them apart,
  # spread across Nx Agents: this job hands out each step's tasks and the agents
  # run them. Their count and setup live in .nx/ci-config.yaml and
  # .nx/workflows/agents.yaml.
  # Only this job distributes: `start-nx-agents` marks its own runner, and an
  # `nx` command distributes only where that mark is. The macOS jobs below run
  # their tasks on their own runners, with the remote cache, and need no opt out.
  checks:
    name: ✅ Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      # The PR's merge commit with its base, which is what lands if it merges.
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # First, so the agents boot while this job installs. Agents need the token,
      # so a fork's PR skips them and runs every task in this job instead.
      - name: 🤖 Start Nx Agents
        id: agents
        if: env.NX_CLOUD_ACCESS_TOKEN != ''
        continue-on-error: true
        run: npx --yes nx-cloud@19.1.3 start-nx-agents

      # Nx Cloud refuses the run once the organization is over its plan's usage, or
      # when it is down. Every task then runs in this job, cached locally only, as a
      # fork's PR does, instead of each nx command retrying the cloud and warning.
      - name: ☁️ Run without Nx Cloud
        if: steps.agents.outcome == 'failure'
        run: |
          echo "::warning::Nx Agents did not start, so this job runs every task itself without Nx Cloud."
          echo 'NX_NO_CLOUD=true' >> "$GITHUB_ENV"

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # For the screen tests when they run here, as a fork's PR runs them; the agents'
      # image has its own Node 24.
      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      # Each Python project's .python-version picks its interpreter. Uncached tasks,
      # such as spellcheck's `uvx typos`, can run in this job instead of on an agent.
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      # raven's server and core tests encode real clips with ffmpeg. The agents
      # install their own, so only a run without them needs it here.
      - name: 🎞️ Install ffmpeg
        if: steps.agents.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # Every check but the build, in one Nx run so the agents work through the whole task
      # graph at once instead of idling at the end of each check: ruff format and oxfmt,
      # tsc without emitting, typos over the whole repo (dotfiles included), ruff, oxlint
      # and gale, pytest, vitest and bun test (raven's server and core tests encode real
      # clips with ffmpeg), jest-expo for the device app's tests that render a native
      # component, which `bun test` cannot load, and knip (no unused file, export, type or
      # dependency) with the check that every module class is read by a TSX. `static` keeps
      # every test's output; Nx's CI default collapses the passing ones to a line.
      - name: 🧪 Checks and tests
        run: >-
          bunx nx run-many --outputStyle=static
          -t format:check typecheck spellcheck lint:py lint:ts lint:css test test:screens dead-code dead-css

      # Every project's build. The agents stay up until this target is done
      # (.nx/ci-config.yaml), so a new step goes before it.
      - name: 🏗️ Build
        run: bun run build

  supabase:
    name: 🗄️ Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - name: Type-check Edge Functions
        run: bunx nx run @raven/supabase:check:functions
      - name: Test Edge Functions
        run: bunx nx run @raven/supabase:test:functions
      - name: Start local auth and database
        run: bunx nx run @raven/supabase:db:start
      - name: Test membership authorization
        run: bunx nx run @raven/supabase:test:db
      - name: Lint database
        run: bunx nx run @raven/supabase:lint:db
      - name: Stop local stack
        if: always()
        run: bunx nx run @raven/supabase:db:stop

  # One native build feeds the other desktop jobs, handed over as an artifact: the app
  # job packages its addon and dylibs, and the two playback checks load them side by side.
  desktop-native:
    name: 🎞️ Desktop native
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      # The PR's head commit, not the merge commit, so the artifact names below match
      # the commit that was built.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun, the toolchain, the install, the cached libmpv build and the addon, shared
      # with desktop-release.yml so a release builds as this does.
      - name: 🔩 Build the native pieces
        uses: ./.github/actions/raven-desktop-native

      # What the app and playback jobs load: the addon and its dylibs, and the source-built
      # ffmpeg that makes the playback clips. A tar keeps ffmpeg's execute bit, which an
      # artifact drops. Packed and uploaded before the audit below, so the jobs that load it
      # start while the audit runs; this job still has to pass for the gate to.
      - name: 📦 Pack the playback handoff
        run: >-
          tar -cf "$RUNNER_TEMP/raven-native-handoff.tar"
          libs/raven/mpv/resources/darwin-arm64
          libs/raven/mpv/native-build/prefix/bin/ffmpeg

      # Only the jobs below read it, so it lives for a day.
      - name: 📤 Playback handoff
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/raven-native-handoff.tar
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the handoff its first attempt left.
          overwrite: true

      # Both only read the built resources, so Nx runs them at once. test:native is
      # cached, keyed on the native sources, the build recipe and the Xcode version.
      - name: 🔎 Audit native resources and run the real headless libmpv tests
        run: bun run mpv:native

      # The addon, its two dylibs and their license notices, as built for this commit.
      - name: 📤 Native playback resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/resources/darwin-arm64
          if-no-files-found: error

      # Every pinned upstream archive, both patches, the build scripts and the exact
      # revision those binaries came from: mpv's GPL and FFmpeg's LGPL want the source
      # beside the binaries.
      - name: 📤 Matching native sources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-sources-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/native-build/source-bundle
          if-no-files-found: error

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the native build.
  desktop-app:
    name: 📦 Desktop app
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Keeps the Xcode version the cached app is keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # The same head commit the native job built, so its handoff matches these sources.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The tar the native job packed, into the runner's temp folder.
      - name: 📥 Native handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the native handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Builds the web app first, which the packaged app serves from its resources.
      - name: 🏗️ Build desktop app
        run: bun run desktop:build

      # Cached on the app's and the native sources, the Xcode version and the signing
      # environment, so an unchanged app restores from Nx Cloud.
      - name: 📦 Make the unsigned app
        run: bun run desktop:make

      # otool, lipo and codesign over every Mach-O file in the app: its architectures,
      # links, rpaths and signature.
      - name: 🔎 Audit the packaged bundle
        run: bun run desktop:audit:bundle

      # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
      - name: 🚬 Smoke the packaged app
        run: bun run desktop:smoke:packaged

      # The unsigned app, for trying the PR's build by hand.
      - name: 📤 Unsigned Raven
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

  desktop-playback:
    name: ${{ matrix.check.name }}
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        check:
          - name: 🧪 Desktop player against headless libmpv
            target: test:native
          # Runs `electron .`, never the packaged app, whose fuses turn off the inspector
          # Playwright needs; the runner's logged-in GUI session shows the window. Electron 44
          # has no postinstall, so the target's `install:electron` step fetches the binary.
          - name: 🎬 Desktop end to end
            target: e2e
            traces: true
    env:
      # Keeps the Xcode version the cached results are keyed on the same as the native job's.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The source-built ffmpeg has VideoToolbox; `-allow_sw 1` falls back to Apple's
      # software H.264 encoder on a VM without a hardware one.
      RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg
    steps:
      # The same head commit the native job built, so its handoff matches these sources.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The tar the native job packed, into the runner's temp folder.
      - name: 📥 Playback handoff
        uses: actions/download-artifact@v8
        with:
          name: raven-native-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      # Puts the addon, dylibs and ffmpeg back where the native job built them.
      - name: 📂 Unpack the playback handoff
        run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

      # Cached on the desktop and native sources and the Xcode version, so a PR that
      # changes neither restores the result from Nx Cloud. Each matrix target has a
      # `desktop:` root script of the same name.
      - name: ${{ matrix.check.name }}
        run: bun run desktop:${{ matrix.check.target }}

      # Playwright's traces, only when a check failed, to replay what went wrong.
      - name: 📤 End to end traces
        if: failure() && matrix.check.traces
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore

  # Whether this PR touches raven's device app, what it imports (core and ui, through
  # Nx's graph), the server its flows sign in to, or this workflow. The app jobs below are
  # cold React Native builds, so they run only then; the 🖥️ Desktop gate takes
  # their skip as a pass.
  app-affected:
    name: 🔍 App affected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      # The PR's head with its whole history, so Nx can find the merge base with the base.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Nx reads the project graph from the installed workspace.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🔍 Is the app affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          projects="$(bunx nx show projects --affected --base="$BASE" --head="$HEAD" --json)"
          echo "Affected: $projects"
          # Anything but a list of names fails the job here, rather than reading as no app.
          echo "$projects" | jq -e 'type == "array" and all(type == "string")' > /dev/null
          workflow="$(git diff --name-only "$BASE...$HEAD" -- .github/workflows/pull-request-checks.yml)"
          if echo "$projects" | jq -e 'index("@raven/app") != null or index("@raven/server") != null' > /dev/null || [ -n "$workflow" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

  # raven's device app on Apple TV: the simulator build and an XCUITest that drives it
  # with the Siri Remote against a real raven server. It runs beside app-ios, on its own
  # runner, since the two builds share nothing.
  app-tvos:
    name: 📺 App on Apple TV
    needs: app-affected
    if: needs.app-affected.outputs.affected == 'true'
    runs-on: macos-26
    # One Release build of React Native from cold (it is not cached) and the remote flow.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # The flow reaches the fixture server over plain http on the loopback, which only
      # the development variant's App Transport Security allows.
      APP_VARIANT: development
    steps:
      # The PR's head commit, so the artifact name below matches the commit that was built.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      # The fixture server encodes its clips and probes them with ffmpeg and ffprobe.
      - name: 🎞️ Install ffmpeg
        run: brew install ffmpeg

      # CocoaPods' downloaded specs and sources, keyed on the lockfile that pins the pods'
      # versions. `expo prebuild --clean` rebuilds ios/ and Pods/, so only the downloads
      # are worth keeping.
      - name: 🗃️ CocoaPods cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-tvos-${{ hashFiles('bun.lock', 'apps/raven/app/package.json') }}

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # A real raven server with a locked film library and an open series library, started
      # while the app builds. It prints its ready line once its libraries are scanned.
      - name: 🗄️ Start the fixture server
        run: bunx nx run @raven/server:serve:fixture > "$RUNNER_TEMP/fixture.log" 2>&1 &

      # Runs `prebuild:tvos` first (bun runs it before `build:tvos`), which regenerates
      # ios/ and installs the pods, so the pods are checked right after.
      - name: 📺 Build for the Apple TV simulator
        run: bunx nx run @raven/app:build:tvos

      # `expo prebuild` exits 0 when `pod install` fails, so the pods are checked by hand:
      # CocoaPods writes Pods/Manifest.lock as a copy of Podfile.lock once it has installed.
      - name: 🔎 Check the Apple TV pods
        working-directory: apps/raven/app/ios
        run: |
          grep -q 'SDKROOT = appletvos' raven.xcodeproj/project.pbxproj
          cmp Podfile.lock Pods/Manifest.lock

      - name: 🗄️ Wait for the fixture server
        run: |
          for _ in $(seq 1 90); do
            if grep -q 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"; then
              grep 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1

      # A fresh Apple TV 4K on the tvOS runtime of the selected Xcode's SDK, booted, with the
      # build on it. A runner with no such runtime fails here rather than testing on another.
      - name: 📺 Boot the Apple TV simulator
        run: |
          sdk="$(xcrun --sdk appletvsimulator --show-sdk-version)"
          runtime="$(xcrun simctl list -j runtimes tvOS | jq -er --arg sdk "$sdk" '[.runtimes[] | select(.isAvailable and (.version == $sdk or (.version | startswith($sdk + "."))))] | last | .identifier')"
          device="$(xcrun simctl create raven-tv com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K "$runtime")"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" apps/raven/app/build/tvos/Build/Products/Release-appletvsimulator/raven.app

      # The XCUITest the tvOS prebuild added (`tvos-e2e/`) signs in, plays the film from
      # Home and returns with the Siri Remote. The screen it ends on goes up with the app.
      - name: 🎬 Apple TV end to end
        env:
          TVOS_SIMULATOR: raven-tv
        run: |
          bun run app:e2e:tvos
          xcrun simctl io raven-tv screenshot "$RUNNER_TEMP/raven-tv.png"
          xcrun simctl shutdown raven-tv

      - name: 📤 End to end logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-tvos-e2e-logs-${{ github.event.pull_request.head.sha }}
          path: |
            apps/raven/app/build/tvos-e2e/Logs/Test
            ${{ runner.temp }}/fixture.log
          if-no-files-found: ignore

      # The build zipped as Finder would, which keeps the execute bits an artifact drops,
      # so the unzipped app still launches.
      - name: 📦 Pack the simulator app
        run: ditto -c -k --keepParent apps/raven/app/build/tvos/Build/Products/Release-appletvsimulator/raven.app "$RUNNER_TEMP/raven-appletvsimulator.zip"

      # The build, for trying the PR's app by hand on a simulator, and the flow's screenshot.
      - name: 📤 Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-tvos-simulator-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/raven-appletvsimulator.zip
            ${{ runner.temp }}/raven-tv.png
          if-no-files-found: error

  # raven's device app on iPhone and iPad: the simulator build and the Maestro flows on
  # the iPhone simulator against a real raven server.
  app-ios:
    name: 📱 App on iPhone and iPad
    needs: app-affected
    if: needs.app-affected.outputs.affected == 'true'
    runs-on: macos-26
    # One Release build of React Native from cold (it is not cached) and the flows.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # The flows reach the fixture server over plain http on the loopback, which only
      # the development variant's App Transport Security allows.
      APP_VARIANT: development
    steps:
      # The PR's head commit, so the artifact names below match the commit that was built.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      # The fixture server encodes its clips and probes them with ffmpeg and ffprobe.
      - name: 🎞️ Install ffmpeg
        run: brew install ffmpeg

      # CocoaPods' downloaded specs and sources, keyed on the lockfile that pins the pods'
      # versions. `expo prebuild --clean` rebuilds ios/ and Pods/, so only the downloads
      # are worth keeping.
      - name: 🗃️ CocoaPods cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-ios-${{ hashFiles('bun.lock', 'apps/raven/app/package.json') }}

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The fixture server, the simulator's boot and Maestro's download do not depend on
      # the build, so they start before it and finish while it compiles. Each runs in the
      # background; the steps after the build wait for them. The fixture server prints its
      # ready line once its libraries are scanned.
      - name: 🗄️ Start the fixture server
        run: bunx nx run @raven/server:serve:fixture > "$RUNNER_TEMP/fixture.log" 2>&1 &

      # A fresh iPhone 16 on the iOS runtime of the selected Xcode's SDK. `simctl boot`
      # returns at once and CoreSimulator boots it in the background; a runner with no such
      # runtime fails here rather than testing on another.
      - name: 📱 Boot the iPhone simulator
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(xcrun simctl list -j runtimes iOS | jq -er --arg sdk "$sdk" '[.runtimes[] | select(.isAvailable and (.version == $sdk or (.version | startswith($sdk + "."))))] | last | .identifier')"
          device="$(xcrun simctl create raven-phone com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")"
          xcrun simctl boot "$device"
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"

      # Maestro's own release, the zip its Homebrew formula installs, pinned by version and
      # checksum. It runs on the runner's Java. The download runs in the background and
      # leaves `maestro.ok` or `maestro.failed` for the wait step.
      - name: 🎭 Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          (
            set -e
            curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
            echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          ) > "$RUNNER_TEMP/maestro.log" 2>&1 && touch "$RUNNER_TEMP/maestro.ok" || touch "$RUNNER_TEMP/maestro.failed" &

      # Runs `prebuild:ios` first (bun runs it before `build:ios`), which regenerates ios/
      # and installs the pods, so the pods are checked right after.
      - name: 📱 Build for the iPhone and iPad simulator
        run: bunx nx run @raven/app:build:ios

      - name: 🔎 Check the iPhone and iPad pods
        working-directory: apps/raven/app/ios
        run: cmp Podfile.lock Pods/Manifest.lock

      - name: ⏳ Wait for the iPhone simulator
        run: xcrun simctl bootstatus "$SIMULATOR" -b

      - name: 📲 Install the build on the iPhone simulator
        run: xcrun simctl install "$SIMULATOR" apps/raven/app/build/ios/Build/Products/Release-iphonesimulator/raven.app

      # A real raven server with a locked film library and an open series library, started
      # above for the flows.
      - name: 🗄️ Wait for the fixture server
        run: |
          for _ in $(seq 1 90); do
            if grep -q 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"; then
              grep 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1

      - name: 🎭 Wait for Maestro
        run: |
          for _ in $(seq 1 90); do
            test -f "$RUNNER_TEMP/maestro.ok" && exit 0
            if test -f "$RUNNER_TEMP/maestro.failed"; then
              cat "$RUNNER_TEMP/maestro.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/maestro.log"
          exit 1

      # Every flow in `apps/raven/app/e2e`, each signing in with the PIN and the admin password
      # first. A fresh runner can start Maestro's XCTest driver slower than it waits by default,
      # so it waits five minutes (in milliseconds).
      - name: 🎬 App end to end
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: bun run app:e2e

      # Maestro's screenshots and logs and the fixture server's log, only when a step failed.
      - name: 📤 End to end logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-e2e-logs-${{ github.event.pull_request.head.sha }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/fixture.log
          if-no-files-found: ignore

      # The build zipped as Finder would, which keeps the execute bits an artifact drops,
      # so the unzipped app still launches.
      - name: 📦 Pack the simulator app
        run: ditto -c -k --keepParent apps/raven/app/build/ios/Build/Products/Release-iphonesimulator/raven.app "$RUNNER_TEMP/raven-iphonesimulator.zip"

      # The build, for trying the PR's app by hand on a simulator.
      - name: 📤 Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-ios-simulator-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/raven-iphonesimulator.zip
          if-no-files-found: error

  # raven's device app for Android TV, on Linux (Ruling 20): GitHub's macOS arm64 runners
  # cannot run the Android emulator. The Release APK, then, against a real raven server, the
  # Maestro flows on an Android TV emulator, driven by the remote's keys.
  app-android-tv:
    name: 📺 App on Android TV
    needs: app-affected
    if: needs.app-affected.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    # A Release build of React Native from cold, the emulator's boot and the flows.
    timeout-minutes: 60
    env:
      # The flows reach the fixture server over plain http on the loopback, which only the
      # development variant's cleartext traffic allows.
      APP_VARIANT: development
    steps:
      # The PR's head commit, so the artifact name below matches the commit that was built.
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.APP_NODE_VERSION }}

      # The runner's Android SDK is ANDROID_HOME already; Gradle and Maestro run on its JDK 17.
      - name: ☕ Use JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # The fixture server encodes its clips and probes them with ffmpeg and ffprobe.
      - name: 🎞️ Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Gradle's downloads, keyed on the lockfile, which pins React Native, Expo and the
      # native modules android/ is generated from.
      - name: 🗃️ Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/raven/app/package.json') }}

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # Runs `prebuild:android-tv` first, which regenerates android/ with the leanback
      # launcher, then Gradle's Release APK.
      - name: 📺 Build the Android TV APK
        run: bunx nx run @raven/app:build:android-tv

      # The Release APK, signed with the debug key Expo's template sets up, for sideloading
      # the PR's build by hand.
      - name: 📤 Android TV APK
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-android-tv-${{ github.event.pull_request.head.sha }}
          path: apps/raven/app/android/app/build/outputs/apk/release
          if-no-files-found: error

      # The emulator runs on KVM, which the runner's user may not open until a udev rule
      # lets it.
      - name: 🧩 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Android TV AVD with a booted snapshot, so a later run boots from it in seconds.
      # The key names everything the AVD is made from; change it with any of them.
      - name: 🗃️ Android TV AVD cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-tv-36-x86_64-tv_1080p-${{ runner.os }}

      # Only on a cache miss: makes the AVD, boots it once and saves the snapshot.
      - name: 📺 Make the Android TV AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Saved the Android TV AVD's snapshot"

      # A real raven server with a locked film library and an open series library, in the
      # background for the flows. It prints its ready line once its libraries are scanned.
      - name: 🗄️ Start the fixture server
        run: |
          bunx nx run @raven/server:serve:fixture > "$RUNNER_TEMP/fixture.log" 2>&1 &
          for _ in $(seq 1 90); do
            if grep -q 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"; then
              grep 'raven fixture server ready' "$RUNNER_TEMP/fixture.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1

      # Maestro's own release, the zip its Homebrew formula installs, pinned by version and
      # checksum, as the Apple job installs it.
      - name: 🎭 Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # Boots the AVD from its snapshot, installs the APK and runs the flows the remote drives
      # (`e2e:android-tv`, every flow but the touch ones), which first point the emulator's
      # 127.0.0.1:8490 at the runner's with `adb reverse`, so the app signs in to the address
      # the iPhone uses. The runner runs each line of the script as its own command. Maestro's
      # driver can start slower on a fresh emulator than it waits by default, so it waits five
      # minutes (in milliseconds).
      - name: 🎬 App end to end
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb install apps/raven/app/android/app/build/outputs/apk/release/app-release.apk
            bun run app:e2e:android-tv

      # Maestro's screenshots and logs and the fixture server's log, only when a step failed.
      - name: 📤 End to end logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raven-app-android-tv-e2e-logs-${{ github.event.pull_request.head.sha }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/fixture.log
          if-no-files-found: ignore

  # The "Protect main" ruleset requires a check named 🖥️ Desktop, so this one stands
  # for every desktop and device app job and passes only when all of them did. The
  # app jobs may also be skipped, when the PR leaves the app alone (app-affected).
  desktop:
    name: 🖥️ Desktop
    needs:
      [
        desktop-native,
        desktop-app,
        desktop-playback,
        app-affected,
        app-tvos,
        app-ios,
        app-android-tv,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Prints each needed job's result, then fails on the first that isn't a success, or
      # for the app jobs a skip.
      - name: ✅ Every desktop job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REQUIRED: >-
            ${{ needs.desktop-native.result }} ${{ needs.desktop-app.result }}
            ${{ needs.desktop-playback.result }} ${{ needs.app-affected.result }}
          APP_RESULTS: ${{ needs.app-tvos.result }} ${{ needs.app-ios.result }} ${{ needs.app-android-tv.result }}
        run: |
          echo "$RESULTS"
          for result in $REQUIRED; do
            test "$result" = success
          done
          for result in $APP_RESULTS; do
            test "$result" = success || test "$result" = skipped
          done

  # The production images, built and health checked by the shared smoke workflow.
  smoke:
    name: 🐳 Smoke test
    uses: ./.github/workflows/smoke-test.yml
