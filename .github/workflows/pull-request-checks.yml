name: 🧪 Pull request checks

# Every pull request, into any base branch: runs when it opens or reopens and
# on each push to its branch. Every check in the repo runs against every
# project, not just the affected ones, then the production images are built
# and health checked. Merges to main are covered by main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, each running the root script you would run locally, so
  # the PR lists them separately and `bun run verify` stays the same set.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        check:
          # typos over the whole repo, dotfiles included.
          - name: 🔤 Spellcheck
            run: bun run spellcheck
          # No tracked .js, .jsx, .mjs or .cjs file anywhere.
          - name: 🟦 TypeScript only
            run: bun run typescript-only
          # No package.json script chained with `&&`, `||` or `;`.
          - name: 🧩 One command per script
            run: bun run one-command-per-script
          # ruff, oxlint and gale.
          - name: 🧹 Lint
            run: bun run lint
          # ruff format, and oxfmt for each project and the root files.
          - name: 🎨 Format check
            run: bun run format:check
          - name: 🔎 Typecheck
            run: bun run typecheck
          # pytest, vitest and bun test. raven's server and core tests encode
          # real clips with ffmpeg.
          - name: 🧪 Unit tests
            run: bun run test:ci
            ffmpeg: true
          - name: 🏗️ Build
            run: bun run build
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Each Python project's .python-version picks its interpreter.
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: 🎞️ Install ffmpeg
        if: matrix.check.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  desktop:
    name: 🖥️ Desktop
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: 📥 Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🛠️ Prepare disposable native toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
          brew install cmake ninja meson pkgconf

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🏗️ Build TypeScript wrapper
        run: bunx nx run @raven/mpv:build

      - name: 💾 Cache own pinned source build
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            libs/raven/mpv/native-build/archives
            libs/raven/mpv/native-build/prefix
            libs/raven/mpv/native-build/source-bundle
            libs/raven/mpv/resources
          key: raven-mpv-darwin-arm64-xcode26.6-${{ hashFiles('libs/raven/mpv/native/**', 'libs/raven/mpv/src/**', 'libs/raven/mpv/test/**', 'libs/raven/mpv/package.json', 'libs/raven/mpv/README.md', 'libs/raven/mpv/tsconfig*.json', 'libs/raven/core/src/**', 'bun.lock', 'tsconfig.base.json', '.github/workflows/pull-request-checks.yml') }}

      - name: 🎞️ Build self-contained libmpv and MoltenVK from source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bunx nx run @raven/mpv:fetch:libmpv

      - name: 🔩 Build N-API addon
        run: bunx nx run @raven/mpv:build:native

      - name: 🔎 Audit native dependencies, sources and signatures
        run: bunx nx run @raven/mpv:audit:native

      - name: 🧪 Real headless libmpv tests
        run: bunx nx run @raven/mpv:test:native

      - name: 📤 Native playback resources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/resources/darwin-arm64
          if-no-files-found: error

      - name: 📤 Matching native sources
        uses: actions/upload-artifact@v7
        with:
          name: raven-native-sources-${{ github.event.pull_request.head.sha }}
          path: libs/raven/mpv/native-build/source-bundle
          if-no-files-found: error

      # Vite's log carries the renderer's gzip sizes, for the 250 KB budget.
      - name: 🏗️ Build desktop app
        run: bunx nx run @raven/desktop:build

      # Runs `electron .`, never the packaged app, whose fuses turn off the inspector
      # Playwright needs; the runner's logged-in GUI session shows the window. Electron 44
      # has no postinstall, so the target's `install:electron` step fetches the binary.
      - name: 🎬 Desktop end to end
        run: bunx nx run @raven/desktop:e2e
        env:
          # The source-built ffmpeg above has VideoToolbox; `-allow_sw 1` falls back to
          # Apple's software H.264 encoder on a VM without a hardware one.
          RAVEN_E2E_FFMPEG: ${{ github.workspace }}/libs/raven/mpv/native-build/prefix/bin/ffmpeg

      - name: 📤 End to end traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raven-desktop-e2e-traces-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/test-results
          if-no-files-found: ignore

      - name: 📦 Make the unsigned app
        run: bunx nx run @raven/desktop:make

      - name: 📤 Unsigned raven player
        uses: actions/upload-artifact@v7
        with:
          name: raven-player-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: apps/raven/desktop/out/make
          if-no-files-found: error

  smoke:
    name: 🐳 Smoke test
    uses: ./.github/workflows/smoke-test.yml
