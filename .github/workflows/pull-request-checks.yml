name: 🧪 Pull request checks

# Every pull request, into any base branch: runs when it opens or reopens and
# on each push to its branch. Each check runs on the projects the PR affects (a
# change to this workflow runs every check on every project), and beside them the
# production images are built and health checked. Once the checks pass, every build starts
# at once: the workspace's, and the native and desktop builds the PR affects, each a job of
# this workflow, and ✅ Checks waits for them. No end to end suite runs here, and none is
# listed: each build is uploaded as an artifact, and the push to main that merges the PR
# runs the suites on those builds (native-checks.yml), where a failure emails the pusher.
# Merges to main are also covered by main-smoke-test.yml.
on:
  pull_request:

permissions:
  contents: read

env:
  # Nx Cloud's remote cache, for every job: each reads and fills it, so a task any job or any
  # earlier run finished is restored, not run again. A fork's pull request gets no secret, and
  # its Nx caches on the runner alone.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # raven's device app loads babel.config.ts through Node's own type stripping, which
  # needs Node 22.18 or newer, wherever Metro runs. `test_native_ci.py` holds every workflow
  # to the same version.
  APP_NODE_VERSION: 24.21.0
  # What the native jobs build and name their artifacts for, and the base their selection diffs
  # against. main's workflow sets the same two for the same jobs.
  NATIVE_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
  NATIVE_SELECT_BASE: ${{ github.event.pull_request.base.sha }}

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks `bun run verify` runs before the build, one target per runner so they execute
  # in parallel and each has its own named log. Nx Cloud still shares completed tasks between jobs through
  # its remote cache.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    strategy:
      # The cancel step below ends the whole run on the first failure, in any job.
      fail-fast: true
      # Nx Cloud bills the peak number of jobs connected at once beyond the 10 included, so
      # the matrix leaves room for the Supabase job and the two web apps' jobs beside it.
      max-parallel: 5
      matrix:
        check:
          - name: 🎨 Format
            target: format:check
            uv: true
          - name: 🧩 Type-check
            target: typecheck
          - name: 🔤 Spellcheck
            target: spellcheck
            uv: true
          - name: 🐍 Python lint
            target: lint:py
            uv: true
          - name: 🟦 TypeScript lint
            target: lint:ts
          - name: 🖌️ CSS lint
            target: lint:css
          - name: 🧪 Tests
            target: test
            ffmpeg: true
            uv: true
          # The device apps' screen tests run on main only (native-checks.yml).
          # The repository rules a linter cannot hold. lefthook's pre-push runs the first three,
          # which are here so a push without the hooks, or an edit on GitHub, meets them; dead
          # code and dead CSS run only here.
          - name: 🟦 TypeScript only
            target: typescript-only
          - name: 🧩 One command per script
            target: one-command-per-script
          - name: 💬 Comment style
            target: comment-style
          - name: 🧹 Dead code
            target: dead-code
          - name: 🧼 Dead CSS
            target: dead-css
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    steps:
      # The PR's merge commit with its base, which is what lands if it merges. The whole
      # history, so Nx can find what the PR changed against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bun's version comes from `packageManager` in package.json.
      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Python checks use each project's pinned interpreter and lockfile.
      - name: 🐍 Set up uv
        if: matrix.check.uv == true
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      # The pinned build keeps raven's encoded test cues stable across runner images;
      # scripts/install_ffmpeg.sh holds the pin, shared with the local image (ci.Dockerfile).
      - name: 🎞️ Install test system tools
        if: matrix.check.ffmpeg == true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          sudo bash scripts/install_ffmpeg.sh

      # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
      - name: 📦 Install
        run: bun install --frozen-lockfile

      # `static` keeps every test's output; Nx's CI default collapses passing tasks. A change
      # to this workflow touches only the root project, so it runs the check on everything.
      # raven's and Wren's web apps are left to their own jobs (raven-web, wren-web), which run
      # every one of these checks on them.
      - name: ${{ matrix.check.name }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TARGET: ${{ matrix.check.target }}
          WEB_APPS: '@raven/web,@raven/music-web'
        run: |
          if git diff --quiet "$BASE" HEAD -- .github/workflows/pull-request-checks.yml; then
            bunx nx affected --outputStyle=static --base="$BASE" --head=HEAD -t "$TARGET" --exclude="$WEB_APPS"
          else
            bunx nx run-many --outputStyle=static -t "$TARGET" --exclude="$WEB_APPS"
          fi

      # A failure anywhere ends the whole run, so no other job keeps burning minutes.
      # A fork's read-only token can't cancel, which is why this never fails the job. Every
      # job here shares this step, the native jobs too, and the selection's copy in
      # native-checks.yml must match it: the event test keeps a failure on main from
      # cancelling, and is always true here.
      - &native-cancel
        name: 🛑 Cancel the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # raven's and Wren's web apps, each a matrix job of its own beside the workspace's checks: the
  # same twelve checks, the build and Lighthouse, on that app alone (`bun run ci:raven:web`,
  # `bun run ci:wren:web`). Neither waits for any other job, and neither cancels the run when one
  # of its checks fails. Each runs when Nx counts its app affected (the app, anything it builds on,
  # or the shared config), and always when this workflow changes.
  web-apps:
    name: 🔎 Select affected web apps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      raven: ${{ steps.select.outputs.raven }}
      wren: ${{ steps.select.outputs.wren }}
    steps:
      # The whole history, so Nx can find what the PR changed against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: 🔎 Select
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- .github/workflows/pull-request-checks.yml; then
            affected="$(bun run --silent ci:affected --json --base="$BASE" --head=HEAD)"
          else
            affected='["@raven/web","@raven/music-web"]'
          fi
          raven="$(jq -c 'index("@raven/web") != null' <<< "$affected")"
          wren="$(jq -c 'index("@raven/music-web") != null' <<< "$affected")"
          echo "raven web: $raven, Wren web: $wren"
          echo "raven=$raven" >> "$GITHUB_OUTPUT"
          echo "wren=$wren" >> "$GITHUB_OUTPUT"

  raven-web:
    name: 🦅 Raven web ${{ matrix.check.name }}
    needs: web-apps
    if: needs.web-apps.outputs.raven == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One check failing leaves the app's others running, so each says where it stands.
      fail-fast: false
      # Nx Cloud bills the peak number of jobs connected at once beyond the 10 included.
      max-parallel: 3
      matrix:
        check: &web-app-checks
          - name: 💬 Comment style
            target: comment-style
          - name: 🖌️ CSS lint
            target: lint:css
          - name: 🧹 Dead code
            target: dead-code
          - name: 🧼 Dead CSS
            target: dead-css
          - name: 🎨 Format
            target: format:check
          - name: 🧩 One command per script
            target: one-command-per-script
          - name: 🐍 Python lint
            target: lint:py
            uv: true
          - name: 🔤 Spellcheck
            target: spellcheck
            uv: true
          - name: 🧪 Tests
            target: test
          - name: 🧩 Type-check
            target: typecheck
          - name: 🟦 TypeScript lint
            target: lint:ts
          - name: 🟦 TypeScript only
            target: typescript-only
          - name: 🏗️ Build
            target: build
          # The build in Google Chrome on simulated mobile and desktop, served as Netlify serves
          # it: the sign-in page, and Home against the server's Lighthouse fixture, which encodes
          # its pictures, clips and tracks with ffmpeg. Fails below the floors in the app's
          # lighthouserc.json.
          - name: 🔦 Lighthouse
            target: lighthouse
            ffmpeg: true
    env:
      UV_FROZEN: '1'
      WEB_APP_SCRIPT: ci:raven:web
      WEB_APP_DIR: apps/raven/web
    steps: &web-app-steps
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🐍 Set up uv
        if: matrix.check.uv == true
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      # scripts/install_ffmpeg.sh holds the pin, shared with the local image (ci.Dockerfile).
      - name: 🎞️ Install test system tools
        if: matrix.check.ffmpeg == true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          sudo bash scripts/install_ffmpeg.sh

      - name: 📦 Install
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        env:
          TARGET: ${{ matrix.check.target }}
        run: bun run "$WEB_APP_SCRIPT" "$TARGET"

      # Lighthouse CI keeps the report of every run.
      - name: 📤 Upload the Lighthouse reports
        if: failure() && matrix.check.target == 'lighthouse'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEB_APP_SCRIPT == 'ci:raven:web' && 'raven' || 'wren' }}-web-lighthouse-reports-${{ github.sha }}
          path: ${{ env.WEB_APP_DIR }}/.lighthouseci
          # Lighthouse CI writes to `.lighthouseci`, which the action skips as a hidden folder by default.
          include-hidden-files: true
          if-no-files-found: ignore

  wren-web:
    name: 🐦 Wren web ${{ matrix.check.name }}
    needs: web-apps
    if: needs.web-apps.outputs.wren == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        check: *web-app-checks
    env:
      UV_FROZEN: '1'
      WEB_APP_SCRIPT: ci:wren:web
      WEB_APP_DIR: apps/raven/music-web
    steps: *web-app-steps

  # Keep the existing order: every matrix check finishes, then every project builds.
  build:
    name: 🏗️ Build
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install
        run: bun install --frozen-lockfile

      # The web apps build in their own jobs (raven-web, wren-web).
      - name: 🏗️ Build
        run: bun run build --exclude=@raven/web,@raven/music-web

      - *native-cancel

  # The native jobs the PR affects, on its head commit, each listed here as a job of its own, their
  # steps held by the shared actions. Main builds nothing (native-checks.yml): it runs the flows on
  # these builds, and its selection is this one, which `test_native_ci.py` checks. They start after the cheap checks, beside
  # the build above, so a lint or test failure stops the run before a macOS runner starts, and so
  # the jobs Nx Cloud counts at once stay within what it includes. Each build is uploaded for
  # main's run to test. A failing selection or build cancels the run, as a check does.
  #
  # Which groups the commit touches (raven's device app, Wren, the desktop) and the plan for each,
  # which every native job below reads: whether the commit selected it, whether to build it in
  # this run, and which run and commit hold its builds. The action says how it decides.
  select:
    name: 🔎 Select affected native checks
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: &native-permissions
      actions: write
      contents: read
    outputs:
      app_selected: ${{ steps.plan.outputs.app_selected }}
      app_build: ${{ steps.plan.outputs.app_build }}
      app_run: ${{ steps.plan.outputs.app_run }}
      app_sha: ${{ steps.plan.outputs.app_sha }}
      music_selected: ${{ steps.plan.outputs.music_selected }}
      music_build: ${{ steps.plan.outputs.music_build }}
      music_run: ${{ steps.plan.outputs.music_run }}
      music_sha: ${{ steps.plan.outputs.music_sha }}
      desktop_selected: ${{ steps.plan.outputs.desktop_selected }}
      desktop_build: ${{ steps.plan.outputs.desktop_build }}
      desktop_run: ${{ steps.plan.outputs.desktop_run }}
      desktop_sha: ${{ steps.plan.outputs.desktop_sha }}
    steps:
      # The run's own commit, which the script reads as GITHUB_SHA: a pull request's merge
      # commit with its base, a push's head. The whole history, so Nx can diff it against the base.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🗺️ Select and plan the native groups
        id: plan
        uses: ./.github/actions/raven-native-select
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}
          base: ${{ env.NATIVE_SELECT_BASE }}

      - *native-cancel

  # The pinned prebuilt libmpv, the addon built against it with MSVC, their audit and tests.
  windows-native:
    name: 🏗️ Build Windows native
    needs: select
    if: needs.select.outputs.desktop_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions: *native-permissions
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔩 Build, audit and test the Windows native pieces
        uses: ./.github/actions/raven-windows-native
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}

      - *native-cancel

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the Windows native build.
  windows-app:
    name: 🏗️ Build Windows app
    needs: windows-native
    runs-on: windows-2025
    timeout-minutes: 30
    permissions: *native-permissions
    steps:
      # The commit the artifact is named for. The native job checks out with no ref, so on a
      # pull request its engine was built from the merge commit.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NATIVE_BUILD_SHA }}

      - name: 🪟 Build, package, audit and smoke the Windows app
        uses: ./.github/actions/raven-windows-app
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}

      - *native-cancel

  # The device app's and Wren's builds: the Release build for the device's simulator or emulator,
  # uploaded as an artifact for main's flows. One job a device, named for it, each on its own
  # runner; what a device needs is its job's `APP_*` variables, and the builds share their steps,
  # which the first job holds and the rest reuse.
  # The iPhone's build runs `prebuild:ios` first (bun runs it before `build:ios`), which
  # regenerates ios/ and installs the pods; Nx caches only the app and the two lockfiles.
  build-iphone:
    name: 🏗️ Build iPhone
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: ios
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:ios --excludeTaskDependencies
      APP_ARTIFACT: raven-app-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Raven.app
      APP_RUNTIME: iOS
    steps: &build-steps # The commit named, so the artifact names match the commit that was built.
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NATIVE_BUILD_SHA }}

      - name: 🏗️ Build and upload the app
        uses: ./.github/actions/raven-app-build
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}
          node-version: ${{ env.APP_NODE_VERSION }}

      - *native-cancel

  # The build runs `prebuild:tvos` first, which adds the Siri Remote's XCUITest target; Nx caches
  # only what the steps and main's flow read: the app, the two lockfiles, the Xcode project, the
  # remote test target and the pods' support files. Pods/ and DerivedData are left out, since
  # they ran Nx Cloud's upload out of open files (EMFILE).
  build-apple-tv:
    name: 🏗️ Build Apple TV
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: tvos
      APP_PROJECT: apps/raven/app
      APP_BUILD: bun run ci:app:tvos:build
      APP_ARTIFACT: raven-app-tvos-simulator
      APP_BUNDLE: build/tvos/Build/Products/Release-appletvsimulator/Raven.app
      APP_RUNTIME: tvOS
      # The remote's XCUITest target is packed beside the app, for main's flow to read.
      APP_TEST_PROJECT: 'true'
    steps: *build-steps

  # The build runs `prebuild:android-tv` first, which regenerates android/ with the leanback
  # launcher, then Gradle's Release APK. Android builds on Linux (Ruling 20): GitHub's macOS arm64
  # runners cannot run the Android emulator.
  build-android-tv:
    name: 🏗️ Build Android TV
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:android-tv --excludeTaskDependencies
      APP_ARTIFACT: raven-app-android-tv
      APP_BUNDLE: ''
    steps: *build-steps

  # The phone prebuild (no leanback launcher, the music service kept) on the Android TV setup, its
  # caches and its x86_64-only build among them.
  build-android-phone:
    name: 🏗️ Build Android phone
    needs: select
    if: needs.select.outputs.app_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/app
      APP_BUILD: bunx nx run @raven/app:build:android --excludeTaskDependencies
      APP_ARTIFACT: raven-app-android
      APP_BUNDLE: ''
    steps: *build-steps

  # Wren, raven's music app, built by the device app's steps, since it builds on the same React
  # Native and pods.
  build-wren-iphone:
    name: 🎵 Build Wren iPhone
    needs: select
    if: needs.select.outputs.music_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: ios
      APP_PROJECT: apps/raven/music
      APP_BUILD: bunx nx run @raven/music:build:ios --excludeTaskDependencies
      APP_ARTIFACT: raven-music-ios-simulator
      APP_BUNDLE: build/ios/Build/Products/Release-iphonesimulator/Wren.app
      APP_RUNTIME: iOS
    steps: *build-steps

  build-wren-android:
    name: 🎵 Build Wren Android
    needs: select
    if: needs.select.outputs.music_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: *native-permissions
    env:
      APP_SETUP: android-tv
      APP_PROJECT: apps/raven/music
      APP_BUILD: bunx nx run @raven/music:build:android --excludeTaskDependencies
      APP_ARTIFACT: raven-music-android
      APP_BUNDLE: ''
    steps: *build-steps

  # One native build feeds packaging, the player's tests and main's suite through an artifact.
  desktop-native:
    name: 🏗️ Build Mac native
    needs: select
    if: needs.select.outputs.desktop_build == 'true'
    # Standard macos-26 is arm64; macos-26-intel is explicitly not supported.
    runs-on: macos-26
    timeout-minutes: 120
    permissions: *native-permissions
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NATIVE_BUILD_SHA }}

      - name: 🔩 Build, hand off, audit and test the Mac native pieces
        uses: ./.github/actions/raven-mac-native
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}

      - *native-cancel

  # Forge bundles the addon and libmpv (stage:mpv), so this waits for the native build.
  desktop-app:
    name: 🏗️ Build Mac app
    needs: desktop-native
    runs-on: macos-26
    timeout-minutes: 30
    permissions: *native-permissions
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NATIVE_BUILD_SHA }}

      - name: 🍎 Build, package, audit and smoke the Mac app
        uses: ./.github/actions/raven-mac-app
        with:
          sha: ${{ env.NATIVE_BUILD_SHA }}

      - *native-cancel

  # The desktop player against headless libmpv, wherever this run built the native pieces: a
  # pull request's, or a push to main that found no build to reuse.
  desktop-test:
    name: 🧪 Test Mac player
    needs: [select, desktop-native]
    runs-on: macos-26
    timeout-minutes: 30
    permissions: *native-permissions
    steps:
      - name: 📥 Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NATIVE_BUILD_SHA }}

      - name: 🧪 Test Mac player
        uses: ./.github/actions/raven-mac-playback
        with:
          target: test:native
          build-run-id: ${{ needs.select.outputs.desktop_run }}
          build-sha: ${{ needs.select.outputs.desktop_sha }}

      - *native-cancel

  # The "Protect main" ruleset requires this stable check name. It passes only when every
  # matrix check, the build and both selections passed, and no web app or native job failed or
  # was cancelled: a native job the PR does not affect is skipped, which is a pass, and one
  # skipped because the checks or the selection failed is caught by those two.
  checks-complete:
    name: ✅ Checks
    needs:
      - checks
      - build
      - select
      - web-apps
      - raven-web
      - wren-web
      - windows-native
      - windows-app
      - build-iphone
      - build-apple-tv
      - build-android-tv
      - build-android-phone
      - build-wren-iphone
      - build-wren-android
      - desktop-native
      - desktop-app
      - desktop-test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ✅ Every check passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          WEB_APPS_RESULT: ${{ needs.web-apps.result }}
          ALL_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Checks: $CHECKS_RESULT"
          echo "Build: $BUILD_RESULT"
          echo "Select: $SELECT_RESULT"
          echo "Web apps: $WEB_APPS_RESULT"
          echo "Every job: $ALL_RESULTS"
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$SELECT_RESULT" = success
          test "$WEB_APPS_RESULT" = success
          case " $ALL_RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  supabase:
    name: 🗄️ Supabase
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    timeout-minutes: 15
    steps:
      # Keep outbound connections from claiming Supabase's ports before Docker binds them.
      - name: Reserve local stack ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54324
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - name: Type-check Edge Functions
        run: bunx nx run @raven/supabase:check:functions
      - name: Test Edge Functions
        run: bunx nx run @raven/supabase:test:functions
      # One cached target starts local auth and the database, runs the membership
      # authorization tests and lints the database, so a PR that leaves `@raven/supabase` alone
      # restores the pass and starts no containers. No Mailpit: the checks send no mail, and its
      # port 54324 sits in the runner's ephemeral range, where a stray connection can hold it
      # and fail the bind.
      - name: Start the local stack, test membership authorization and lint the database
        run: bunx nx run @raven/supabase:test:db:ci
      # `supabase stop` fails without the signing keys the start writes, so a run restored
      # from the cache, which started nothing, has nothing to stop.
      - name: Stop local stack
        if: always() && hashFiles('apps/raven/supabase/signing_keys.json') != ''
        run: bunx nx run @raven/supabase:db:stop

      - *native-cancel

  # The production images, built and health checked by the shared smoke workflow.
  smoke:
    name: 🐳 Smoke test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/smoke-test.yml
