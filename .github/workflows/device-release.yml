name: 📱 Android releases

# Builds every Android APK and attaches them to the release of each pushed vX.Y.Z tag
# (scripts/bump_version.sh --push), for the splash's dev builds page (maester.tv/dev-builds/)
# to list: raven's device app for Android TV as raven-app-<version>-android-tv.apk, the same
# app for Android phones as raven-app-<version>-android.apk, and Wren as
# wren-<version>-android.apk. release.yml creates that release; each job waits for it and
# uploads with --clobber, so a re-run replaces its APK. Only three-number tags run it: a
# vX.Y.Z.N build tag never builds the apps.
#
# A run from the Actions tab names a tag and builds that tag's apps, to give a release that
# came out before this workflow its APKs: `gh workflow run device-release.yml -f tag=v0.8.10`.
#
# The same tag also sends raven's Google Play bundles, the TV's and the phone's, to Play's
# internal track, once the repository variable RAVEN_PLAY_UPLOAD is `on` (see the `play` job).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to build the app of and attach it to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: device-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # `test_native_ci.py` holds every workflow's APP_NODE_VERSION to the same version.
  APP_NODE_VERSION: 24.21.0

jobs:
  android:
    name: ${{ matrix.apk.name }}
    runs-on: ubuntu-24.04
    # A Release build of React Native for two ABIs, warm or cold.
    timeout-minutes: 90
    # Uploading the APK writes to the repo; nothing else here does.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Nx Cloud's remote cache. A release's version is new, so its first build always runs
      # and is stored; a rerun of the same tag restores the APK instead of building it again.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    strategy:
      # One APK failing still ships the others.
      fail-fast: false
      matrix:
        apk:
          - name: 📺 Build and attach the Android TV APK
            project: '@raven/app'
            folder: apps/raven/app
            target: build:android-tv
            prefix: raven-app
            download: android-tv.apk
          - name: 📱 Build and attach the Android phone APK
            project: '@raven/app'
            folder: apps/raven/app
            target: build:android
            prefix: raven-app
            download: android.apk
          - name: 🎵 Build and attach the Wren APK
            project: '@wren/app'
            folder: apps/wren/wren-app
            target: build:android
            prefix: wren
            download: android.apk
    steps:
      - name: 📥 Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: 🏷️ Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          tag: ${{ env.TAG }}
          folder: ${{ matrix.apk.folder }}

      # The Android TV setup serves every Android build: the phone and Wren APKs build the same way.
      - name: 🧰 Set up the app build
        uses: ./.github/actions/raven-app-setup
        with:
          platform: android-tv
          project: ${{ matrix.apk.folder }}
          node-version: ${{ env.APP_NODE_VERSION }}

      # The setup writes the e2e build's environment: the development variant, the fixture
      # server's address and an x86_64-only APK for the emulator. A later write wins, so the
      # release build signs in at the public raven and runs on TVs and phones, which are ARM.
      - name: 🌱 Release build environment
        run: |
          {
            echo "APP_VARIANT=production"
            echo "EXPO_PUBLIC_RAVEN_BYPASS_ORIGIN="
            echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a,armeabi-v7a"
          } >> "$GITHUB_ENV"

      # Runs the target's prebuild first, then Gradle's Release APK. Nx keys the build on all
      # three variables above, so no cached emulator APK stands in for it.
      - name: 🛠️ Build the APK
        run: bunx nx run ${{ matrix.apk.project }}:${{ matrix.apk.target }} --excludeTaskDependencies

      # <prefix>-<version>-<download>, the names the splash's catalogs (`releases.ts`) read.
      - name: 🗂️ Name the APK
        env:
          FOLDER: ${{ matrix.apk.folder }}
          PREFIX: ${{ matrix.apk.prefix }}
          DOWNLOAD: ${{ matrix.apk.download }}
        run: |
          mkdir -p release
          cp "$FOLDER/android/app/build/outputs/apk/release/app-release.apk" \
            "release/$PREFIX-${TAG#v}-$DOWNLOAD"
          ls -l release

      # release.yml makes the release from the same tag push, and may not be done yet. A
      # backfill's release already exists, and its tag predates this action.
      - name: ⏳ Wait for the release
        if: github.event_name == 'push'
        uses: ./.github/actions/wait-for-release
        with:
          tag: ${{ env.TAG }}

      - name: 📤 Upload the APK
        run: gh release upload "$TAG" release/* --clobber

  # raven's App Bundles for Google Play, the TV's and the phone's, signed with the upload key and
  # sent to Play's internal track. Off until the repository variable RAVEN_PLAY_UPLOAD is `on`,
  # since it needs three secrets and an app Play has already taken one bundle of by hand (its API
  # uploads to an app only after that): RAVEN_PLAY_UPLOAD_STORE, the upload key's PKCS12 store
  # in base64, RAVEN_UPLOAD_PASSWORD, its password, and GOOGLE_PLAY_SERVICE_ACCOUNT, the JSON key
  # of a service account Play Console has given release rights. The release is a draft until
  # RAVEN_PLAY_STATUS says `completed`, as Play requires while the app has never been published.
  play:
    name: ▶️ Build and send the Google Play bundles
    if: vars.RAVEN_PLAY_UPLOAD == 'on'
    runs-on: ubuntu-24.04
    # Two Release builds of React Native for two ABIs, one after the other.
    timeout-minutes: 120
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - name: 📥 Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: 🏷️ Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          tag: ${{ env.TAG }}
          folder: apps/raven/app

      - name: 🧰 Set up the app build
        uses: ./.github/actions/raven-app-setup
        with:
          platform: android-tv
          project: apps/raven/app
          node-version: ${{ env.APP_NODE_VERSION }}

      # The store goes to the runner's temporary folder, which is wiped with the job, and its
      # path and password reach the Play script through the variables it reads in place of the
      # Keychain. The script sets the production variant and the ARM ABIs itself.
      - name: 🔑 Upload key
        env:
          STORE: ${{ secrets.RAVEN_PLAY_UPLOAD_STORE }}
        run: |
          store="$RUNNER_TEMP/raven-play-upload.p12"
          base64 --decode <<< "$STORE" > "$store"
          echo "RAVEN_UPLOAD_STORE_FILE=$store" >> "$GITHUB_ENV"

      # One after the other, since both prebuild the same android/ folder. Each takes its build's
      # UTC minute as its versionCode, so the phone's lands above the TV's.
      - name: 📺 Build the Android TV bundle
        env:
          RAVEN_UPLOAD_PASSWORD: ${{ secrets.RAVEN_UPLOAD_PASSWORD }}
        run: bunx nx run @raven/app:play:android-tv --excludeTaskDependencies

      - name: 📱 Build the Android phone bundle
        env:
          RAVEN_UPLOAD_PASSWORD: ${{ secrets.RAVEN_UPLOAD_PASSWORD }}
        run: bunx nx run @raven/app:play:android --excludeTaskDependencies

      # Pinned to v1.1.5's commit, since it holds the service account's key.
      - name: 📤 Send the bundles to the internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: io.github.codebend3r.raven.app
          releaseFiles: apps/raven/app/build/play-*/*.aab
          releaseName: ${{ env.TAG }}
          track: internal
          status: ${{ vars.RAVEN_PLAY_STATUS || 'draft' }}
