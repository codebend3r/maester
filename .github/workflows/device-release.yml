name: 📱 Android release APKs

# Builds every Android APK and attaches them to the release of each pushed vX.Y.Z tag
# (scripts/bump_version.sh --push), for the splash's dev builds page (maester.tv/dev-builds/)
# to list: raven's device app for Android TV as raven-app-<version>-android-tv.apk, the same
# app for Android phones as raven-app-<version>-android.apk, and Wren as
# wren-<version>-android.apk. release.yml creates that release; each job waits for it and
# uploads with --clobber, so a re-run replaces its APK. Only three-number tags run it: a
# vX.Y.Z.N build tag never builds the apps.
#
# A run from the Actions tab names a tag and builds that tag's apps, to give a release that
# came out before this workflow its APKs: `gh workflow run device-release.yml -f tag=v0.8.10`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to build the app of and attach it to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: device-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # `test_native_ci.py` holds every workflow's APP_NODE_VERSION to the same version.
  APP_NODE_VERSION: 24.21.0

jobs:
  android:
    name: ${{ matrix.apk.name }}
    runs-on: ubuntu-24.04
    # A Release build of React Native for two ABIs, warm or cold.
    timeout-minutes: 90
    # Uploading the APK writes to the repo; nothing else here does.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Nx Cloud's remote cache. A release's version is new, so its first build always runs
      # and is stored; a rerun of the same tag restores the APK instead of building it again.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    strategy:
      # One APK failing still ships the others.
      fail-fast: false
      matrix:
        apk:
          - name: 📺 Build and attach the Android TV APK
            project: '@raven/app'
            folder: apps/raven/app
            target: build:android-tv
            prefix: raven-app
            download: android-tv.apk
          - name: 📱 Build and attach the Android phone APK
            project: '@raven/app'
            folder: apps/raven/app
            target: build:android
            prefix: raven-app
            download: android.apk
          - name: 🎵 Build and attach the Wren APK
            project: '@raven/music'
            folder: apps/raven/music
            target: build:android
            prefix: wren
            download: android.apk
    steps:
      - name: 📥 Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Fails before the long build when the tag is not a release or the app disagrees on it.
      - name: 🏷️ Check the tag
        env:
          FOLDER: ${{ matrix.apk.folder }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z release tag."
            exit 1
          fi
          version=$(jq -r .version "$FOLDER/package.json")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG is not v$version, the version in $FOLDER/package.json."
            exit 1
          fi

      # The Android TV setup serves every Android build: the phone and Wren APKs build the same way.
      - name: 🧰 Set up the app build
        uses: ./.github/actions/raven-app-setup
        with:
          platform: android-tv
          project: ${{ matrix.apk.folder }}
          node-version: ${{ env.APP_NODE_VERSION }}

      # The setup writes the e2e build's environment: the development variant, the fixture
      # server's address and an x86_64-only APK for the emulator. A later write wins, so the
      # release build signs in at the public raven and runs on TVs and phones, which are ARM.
      - name: 🌱 Release build environment
        run: |
          {
            echo "APP_VARIANT=production"
            echo "EXPO_PUBLIC_RAVEN_BYPASS_ORIGIN="
            echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a,armeabi-v7a"
          } >> "$GITHUB_ENV"

      # Runs the target's prebuild first, then Gradle's Release APK. Nx keys the build on all
      # three variables above, so no cached emulator APK stands in for it.
      - name: 🛠️ Build the APK
        run: bunx nx run ${{ matrix.apk.project }}:${{ matrix.apk.target }} --excludeTaskDependencies

      # <prefix>-<version>-<download>, the names the splash's catalogs (`releases.ts`) read.
      - name: 🗂️ Name the APK
        env:
          FOLDER: ${{ matrix.apk.folder }}
          PREFIX: ${{ matrix.apk.prefix }}
          DOWNLOAD: ${{ matrix.apk.download }}
        run: |
          mkdir -p release
          cp "$FOLDER/android/app/build/outputs/apk/release/app-release.apk" \
            "release/$PREFIX-${TAG#v}-$DOWNLOAD"
          ls -l release

      # release.yml makes the release from the same tag push, and may not be done yet. A
      # backfill's release already exists, and its tag predates this action.
      - name: ⏳ Wait for the release
        if: github.event_name == 'push'
        uses: ./.github/actions/wait-for-release
        with:
          tag: ${{ env.TAG }}

      - name: 📤 Upload the APK
        run: gh release upload "$TAG" release/* --clobber
