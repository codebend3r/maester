name: 🔩 raven desktop native build
description: >-
  Builds Raven's native pieces on a macOS arm64 runner: Bun, the disposable
  toolchain, the install, the Nx cached libmpv and MoltenVK source build and the N-API
  addon. The caller audits them.

# Shared by the PR's 🎞️ Desktop native job (pull-request-checks.yml) and the release
# build (desktop-release.yml), so a release builds exactly as the PR did. A composite
# action reads no secrets: the calling workflow sets DEVELOPER_DIR, HOMEBREW_NO_AUTO_UPDATE
# and NX_CLOUD_ACCESS_TOKEN in its env, which every step here inherits.
runs:
  using: composite
  steps:
    # Bun's version comes from `packageManager` in package.json.
    - name: 🍞 Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: 🛠️ Prepare disposable native toolchain
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        xcodebuild -version
        if ! xcrun metal --version; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        xcrun metal --version
        brew install cmake ninja meson pkgconf

    - name: 📦 Install
      shell: bash
      run: bun install --frozen-lockfile

    # fetch:libmpv is an Nx cached task, so Nx Cloud restores the source build for any
    # run with the same inputs. With no token (a fork's PR) it builds cold: Nx 23 ties
    # .nx/cache to a per-machine database, so restoring it on a fresh runner never hits.
    - name: 🎞️ Build self-contained libmpv and MoltenVK from source
      shell: bash
      run: bunx nx run @raven/mpv:fetch:libmpv

    - name: 🔩 Build N-API addon
      shell: bash
      run: bunx nx run @raven/mpv:build:native
