name: 🧹 Delete superseded caches
description: >-
  Deletes the current ref's cache entries a save superseded: for each "<prefix> <key>"
  line, every entry under the prefix but the key, once that key is really saved.

# app-caches.yml saves under per-run keys (ccache, Gradle) and per-image or per-lockfile
# keys (packages, CocoaPods, the AVD), and main's newest entry is the one every PR
# restores, so the older ones only fill the repo's cache. The job needs `actions: write`.
inputs:
  keep:
    description: One "<prefix> <key>" line per cache family
    required: true
runs:
  using: composite
  steps:
    # A save that failed only warns, so a family is skipped until its kept key exists. The
    # caches are saved by now, so a failed listing skips the family and a failed delete (one
    # that raced another job's, or GitHub's own eviction) is ignored.
    - name: 🧹 Delete superseded caches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        KEEP: ${{ inputs.keep }}
      run: |
        while read -r prefix key; do
          [ -n "$prefix" ] || continue
          kept="$(gh cache list --ref "$GITHUB_REF" --key "$key" --json key --jq ".[] | select(.key == \"$key\") | .key")" || continue
          [ -n "$kept" ] || continue
          ids="$(gh cache list --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key --jq ".[] | select(.key != \"$key\") | .id")" || continue
          for id in $ids; do gh cache delete "$id" || true; done
        done <<< "$KEEP"
