name: 🍎 raven Mac app build
description: >-
  Builds, packages, audits and smoke tests Raven for the Mac on the native handoff this run's
  Mac native job uploaded, and uploads the unsigned app as an artifact named for the commit. The
  caller checks out that commit first.

# Shared by the 🏗️ Build Mac app job of pull-request-checks.yml and of native-checks.yml. Forge
# bundles the addon and libmpv (stage:mpv), so the job waits for the native build. It selects
# the native job's Xcode for the tools the make and the audit run.
inputs:
  sha:
    description: The commit that was checked out, which the artifacts are named for.
    required: true

runs:
  using: composite
  steps:
    - name: 🛠️ Xcode
      uses: ./.github/actions/raven-xcode

    - name: 🍞 Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: 📦 Install
      shell: bash
      run: bun install --frozen-lockfile

    - name: 📥 Native handoff
      uses: actions/download-artifact@v8
      with:
        name: raven-native-handoff-${{ inputs.sha }}
        path: ${{ runner.temp }}

    # Puts the addon, dylibs and ffmpeg back where the native job built them.
    - name: 📂 Unpack the native handoff
      shell: bash
      run: tar -xf "$RUNNER_TEMP/raven-native-handoff.tar"

    # Builds the web app first, which the packaged app serves from its resources.
    - name: 🏗️ Build desktop app
      shell: bash
      run: bun run desktop:build

    - name: 📦 Make the unsigned app
      shell: bash
      run: bun run desktop:make

    # otool, lipo and codesign over every Mach-O file in the app.
    - name: 🔎 Audit the packaged bundle
      shell: bash
      run: bun run desktop:audit:bundle

    # Launches the packaged app with no test hooks and checks it starts and quits cleanly.
    - name: 🚬 Smoke the packaged app
      shell: bash
      run: bun run desktop:smoke:packaged

    - name: 📤 Unsigned Raven
      uses: actions/upload-artifact@v7
      with:
        name: raven-player-darwin-arm64-${{ inputs.sha }}
        path: apps/raven/desktop/out/make
        if-no-files-found: error
