name: 🧰 raven app build setup
description: >-
  Everything before a native build of raven's device app: Bun, Node, the build caches
  restored, ffmpeg and ccache, the build environment, the install and the libraries.
  Restores only; its outputs are each cache's key and path, for app-caches.yml to save.

# The single definition of how the app is built, shared by the app jobs in
# pull-request-checks.yml and by app-caches.yml, which builds on main and saves the
# caches: ccache hashes the compiler and its flags, so a setting either side changed
# alone would leave every PR compiling cold. A pull request's caches are scoped to its
# own ref, so each PR saving its own copy filled the repo's cache with duplicates; main's
# are readable by every PR. The ccache and Gradle keys are per run, so main's newest wins.
inputs:
  platform:
    description: ios, tvos or android-tv
    required: true
  node-version:
    description: The Node the app's tooling runs on, at least 22.18 (babel.config.ts)
    required: true
# A cache's version includes its paths, so a save names exactly the paths restored here.
outputs:
  packages-key:
    description: Homebrew's (Apple) or apt's (Android TV) packages
    value: ${{ steps.keys.outputs.packages }}
  packages-path:
    value: ${{ steps.keys.outputs.packages-path }}
  dependencies-key:
    description: CocoaPods' (Apple) or Gradle's (Android TV) downloads
    value: ${{ steps.keys.outputs.dependencies }}
  dependencies-path:
    value: ${{ steps.keys.outputs.dependencies-path }}
  ccache-key:
    description: ccache's objects
    value: ${{ steps.keys.outputs.ccache }}
  ccache-path:
    value: ${{ steps.keys.outputs.ccache-path }}
  # Whether an exact key was restored, so a save is skipped when it would only fail.
  packages-hit:
    value: ${{ steps.packages.outputs.cache-hit }}
  dependencies-hit:
    value: ${{ steps.dependencies.outputs.cache-hit }}
  supersedes:
    description: One "<prefix> <key>" line per cache, for delete-superseded-caches
    value: ${{ steps.keys.outputs.supersedes }}
runs:
  using: composite
  steps:
    # The runner image pins Homebrew's and apt's package versions, so its name keys them.
    # A Gradle key is per run, falling back to the newest for the lockfile, then any; a
    # CocoaPods key is per lockfile, falling back to the newest for the platform; a ccache
    # key is per run, falling back to the newest for the platform.
    - name: 🔑 Cache keys
      id: keys
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LOCK: ${{ hashFiles('bun.lock', 'apps/raven/app/package.json') }}
      run: |
        case "$PLATFORM" in
          android-tv)
            packages_prefix=apt-
            packages_path="$HOME/apt-archives"
            dependencies_prefix="gradle-$RUNNER_OS-"
            dependencies="gradle-$RUNNER_OS-$LOCK-$GITHUB_RUN_ID"
            dependencies_path="$HOME/.gradle/caches"$'\n'"$HOME/.gradle/wrapper"
            dependencies_restore="gradle-$RUNNER_OS-$LOCK-"$'\n'"gradle-$RUNNER_OS-"
            ccache_path="$HOME/.cache/ccache"
            ;;
          ios | tvos)
            # Per platform: the iPhone and Apple TV legs run on the same image, but each
            # deletes its family's other entries, and a runner image rollout can split them.
            packages_prefix="brew-$PLATFORM-"
            packages_path="$HOME/Library/Caches/Homebrew/downloads"
            dependencies_prefix="cocoapods-$RUNNER_OS-$PLATFORM-"
            dependencies="cocoapods-$RUNNER_OS-$PLATFORM-$LOCK"
            dependencies_path="$HOME/Library/Caches/CocoaPods"
            dependencies_restore="cocoapods-$RUNNER_OS-$PLATFORM-"
            ccache_path="$HOME/Library/Caches/ccache"
            ;;
          *)
            echo "Unknown platform: $PLATFORM (ios, tvos or android-tv)" >&2
            exit 1
            ;;
        esac
        packages="$packages_prefix$ImageOS-$ImageVersion-ffmpeg-ccache-v1"
        ccache_prefix="ccache-$RUNNER_OS-$PLATFORM-"
        ccache="$ccache_prefix$GITHUB_RUN_ID"
        {
          echo "packages=$packages"
          echo "packages-path=$packages_path"
          echo "dependencies=$dependencies"
          printf 'dependencies-path<<LIST\n%s\nLIST\n' "$dependencies_path"
          printf 'dependencies-restore<<LIST\n%s\nLIST\n' "$dependencies_restore"
          echo "ccache=$ccache"
          echo "ccache-path=$ccache_path"
          echo "ccache-restore=$ccache_prefix"
          printf 'supersedes<<LIST\n%s %s\n%s %s\n%s %s\nLIST\n' \
            "$packages_prefix" "$packages" "$dependencies_prefix" "$dependencies" "$ccache_prefix" "$ccache"
        } >> "$GITHUB_OUTPUT"

    # Bun's version comes from `packageManager` in package.json.
    - name: 🍞 Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: 🟩 Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: 🗃️ Packages
      id: packages
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.keys.outputs.packages-path }}
        key: ${{ steps.keys.outputs.packages }}

    - name: 🗃️ Dependencies
      id: dependencies
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.keys.outputs.dependencies-path }}
        key: ${{ steps.keys.outputs.dependencies }}
        restore-keys: ${{ steps.keys.outputs.dependencies-restore }}

    - name: 🗃️ ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.keys.outputs.ccache-path }}
        key: ${{ steps.keys.outputs.ccache }}
        restore-keys: ${{ steps.keys.outputs.ccache-restore }}

    # ffmpeg for the fixture server's clips, and ccache for the compile: Expo's Podfile reads
    # USE_CCACHE at `pod install` and points Xcode's compilers at React Native's wrappers.
    # DEVELOPER_DIR is the Xcode every Apple build, and so its ccache objects, are made with.
    # React Native's compiler wrapper runs `$CCACHE_BINARY clang`, but Xcode passes build
    # settings to no compiler's environment, so its CCACHE_BINARY setting never arrived and
    # every compile ran plain clang with ccache's stats at zero; the environment sets it.
    #
    # CocoaPods fetches the Hermes tarball with plain curl, which without a ~/.curlrc waits
    # out a stalled mirror for as long as the job lasts; this one drops a transfer under
    # 100 KB/s for 30 seconds and tries it again.
    - name: 🍎 Apple build tools
      if: inputs.platform != 'android-tv'
      shell: bash
      env:
        CCACHE_PATH: ${{ steps.keys.outputs.ccache-path }}
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      run: |
        brew install ffmpeg ccache
        printf 'speed-limit = 102400\nspeed-time = 30\nretry = 5\n' > ~/.curlrc
        {
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer"
          echo "USE_CCACHE=1"
          echo "CCACHE_BINARY=$(command -v ccache)"
          echo "CCACHE_DIR=$CCACHE_PATH"
          echo "CCACHE_MAXSIZE=1500M"
        } >> "$GITHUB_ENV"
        CCACHE_DIR="$CCACHE_PATH" ccache --zero-stats

    # ffmpeg for the fixture server's clips, ccache for the compile, which React Native's
    # Android CMake uses whenever it is on the path. `org.gradle.caching` turns Gradle's build
    # cache on for android/, which each prebuild generates afresh. Gradle runs on the runner's
    # JDK 17. React Native compiles its native code once per ABI, four by default; the flows
    # run on an x86_64 emulator, so CI builds only that, and its APK runs on no TV.
    - name: 🤖 Android build tools
      if: inputs.platform == 'android-tv'
      shell: bash
      env:
        CCACHE_PATH: ${{ steps.keys.outputs.ccache-path }}
      run: |
        mkdir -p ~/apt-archives/partial ~/.gradle
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg ccache
        sudo chown -R "$USER" ~/apt-archives
        echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
        {
          echo "JAVA_HOME=$JAVA_HOME_17_X64"
          echo "CCACHE_DIR=$CCACHE_PATH"
          echo "CCACHE_MAXSIZE=1G"
          echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=x86_64"
        } >> "$GITHUB_ENV"
        CCACHE_DIR="$CCACHE_PATH" ccache --zero-stats

    # The flows reach the accountless fixture over plain http on the loopback. The development
    # variant allows it, and Expo bundles the fixture's address into the build. Both are Nx
    # inputs of the build and e2e targets.
    - name: 🌱 Build environment
      shell: bash
      run: |
        {
          echo "APP_VARIANT=development"
          echo "EXPO_PUBLIC_RAVEN_BYPASS_ORIGIN=http://127.0.0.1:8490"
        } >> "$GITHUB_ENV"

    # Fails instead of rewriting bun.lock when package.json and the lockfile disagree.
    - name: 📦 Install
      shell: bash
      run: bun install --frozen-lockfile

    # Gradle installs the NDK React Native's `libs.versions.toml` names by itself, from a
    # download it checks only when it unpacks it, so a short read ("Archive is not a ZIP
    # archive") failed a build. sdkmanager installs it here first, checks the download's
    # digest, and a bad one is tried again.
    - name: 🧱 Android NDK
      if: inputs.platform == 'android-tv'
      shell: bash
      working-directory: apps/raven/app
      run: |
        toml="$(node -p "require('path').dirname(require.resolve('react-native/package.json'))")/gradle/libs.versions.toml"
        ndk="$(awk -F'"' '/^ndkVersion = /{ print $2 }' "$toml")"
        test -n "$ndk"
        for attempt in 1 2 3; do
          if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null; then
            exit 0
          fi
          rm -rf "$ANDROID_HOME/ndk/$ndk"
          echo "attempt $attempt failed to install ndk;$ndk"
          sleep 15
        done
        exit 1

    # The fixture server and the app build are two Nx processes that would each run the
    # libraries' `build` (it starts with `rm -rf dist`) at once, so the server could import
    # `dist` between `tsc` and `tsc-alias`, while it still holds `@/` paths. Built once here,
    # so both skip their own dependency builds.
    - name: 🧱 Build the libraries
      shell: bash
      run: bunx nx run-many -t build -p @raven/core @raven/ui @shared/server
