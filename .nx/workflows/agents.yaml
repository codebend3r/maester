# How each Nx Agent sets itself up before it runs tasks. Nx Cloud's prebuilt
# templates install with npm, yarn or pnpm only, so this one installs the same
# toolchain the PR checks used to: Bun, uv and ffmpeg.
# https://nx.dev/docs/kb/launch-templates
launch-templates:
  linux-medium:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    env:
      # uv runs against the committed lockfiles, never re-resolving them.
      UV_FROZEN: '1'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
      - name: Restore Bun and uv caches
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'bun.lock|**/uv.lock'
          paths: |
            ~/.bun/install/cache
            ~/.cache/uv
          base-branch: 'main'
      # raven's server and core tests encode real clips with ffmpeg. The image's
      # apt has ffmpeg 4.4, which puts those clips' cues 23ms late, so the agents
      # install a pinned static build instead. luwin's tests read time zones from
      # tzdata, which the image leaves out. Bun's installer needs unzip.
      - name: Install ffmpeg, tzdata and unzip
        script: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata unzip
          build=ffmpeg-n9.0.2-28-g669f5ab083-linux64-gpl-9.0
          curl -fsSL -o "/tmp/$build.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-17-20-51/$build.tar.xz"
          echo "cc171d4d373f9ca633741d38fae6a17cd914075818febb1465f6f64e6d57f7ca  /tmp/$build.tar.xz" | sha256sum -c -
          tar -xf "/tmp/$build.tar.xz" -C /tmp
          sudo install -m 755 "/tmp/$build/bin/ffmpeg" "/tmp/$build/bin/ffprobe" /usr/local/bin/
          ffmpeg -version | head -n 1
      # Bun's version comes from `packageManager` in package.json. Each Python
      # project's .python-version picks its interpreter, which uv downloads.
      - name: Install Bun and uv
        script: |
          set -euo pipefail
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v$bun_version"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "PATH=$HOME/.bun/bin:$HOME/.local/bin:$PATH" >> $NX_CLOUD_ENV
      - name: Install
        script: bun install --frozen-lockfile
