[project]
name = "maester"
version = "0.2.0"
description = "AI concierge for a private Plex server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.60",
    "discord.py>=2.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
maester = "maester.__main__:main"
maester-eval = "maester.evals:main"

[dependency-groups]
dev = [
    "lefthook>=2.1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maester"]

[tool.ruff]
# Pinned so lint matches everywhere; without this ruff falls back to
# whatever machine-level config is present, which CI won't have.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
