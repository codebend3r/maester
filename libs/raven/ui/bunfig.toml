[test]
# Register the DOM and missing media globals before components or Testing Library.
preload = [
  "./src/test/happy-dom.ts",
  "./src/test/mediaError.ts",
  "../../../tooling/web/scss-modules.ts",
  "./src/test-setup.ts",
]
# headless-check has its own bunfig: this one preloads the DOM it must run without.
pathIgnorePatterns = ["headless-check/**"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "src/test/**",
  "src/test-setup.ts",
  "../../../tooling/**",
  "../core/**",
]
