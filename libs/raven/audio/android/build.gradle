plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ravenaudio'
version = '1.0.0'

// react-native-video 6.19.3's (`RNVideo_media3Version`), so the workspace builds against one
// Media3; a bump of either moves both together.
def media3Version = '1.8.0'

android {
  namespace "expo.modules.ravenaudio"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-session:${media3Version}"
  testImplementation 'junit:junit:4.13.2'
}
