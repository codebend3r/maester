appId: app.netlify.wren.tv
name: Search finds the fixture's album by a word of its title
---
- runFlow: steps/signIn.yaml
- runFlow:
    file: steps/sidebarPlace.yaml
    env:
      PLACE: Search
# Search opens with the remote on its field; select opens the TV's keyboard.
- pressKey: Remote Dpad Center
- inputText: Morning
- pressKey: Enter
# Every song of the album matches too, so a song leads All; the Albums filter shows the album.
- repeat:
    times: 3
    while:
      notVisible:
        text: All
        focused: true
    commands:
      - pressKey: Remote Dpad Down
- repeat:
    times: 3
    while:
      notVisible:
        text: Albums
        focused: true
    commands:
      - pressKey: Remote Dpad Right
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: Morning Chorus.*
    timeout: 30000
