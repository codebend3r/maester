appId: app.netlify.wren
name: Open the fixture server on a clean install
# The build names the fixture through EXPO_PUBLIC_RAVEN_BYPASS_ORIGIN, so this accountless test
# goes straight to the tabs on it: Wren never asks for a PIN.
---
- launchApp:
    clearState: true
    clearKeychain: true
# On a loaded CI simulator XCTest's first look at a launching app can hold it for close to a
# minute before Wren asks the fixture for anything, so Home gets two minutes to show.
- extendedWaitUntil:
    visible: Recently added
    timeout: 120000
