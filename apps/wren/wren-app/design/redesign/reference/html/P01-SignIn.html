.tn{font-variant-numeric:tabular-nums}

body{padding:40px;background:#8f8b84}</style>

<a href="#" style="align-self: center; font-size: 14px; font-weight: 500; color: var(--accent-text); text-decoration: none; padding: 10px">Forgot password?</a>

<span style="font-size: 12px; color: var(--text3)">Part of Maester</span>
