name: asking whether raven is down gets what is up and what is down
tier: friend
services:
  down: [raven, "radarr:vermithor"]
turns:
  - user: "is raven down? nothing loads for me"
    expect_tools: [service_health]
    reply_matches: "raven.*(down|not (responding|answering))|(down|not (responding|answering)).*raven"
