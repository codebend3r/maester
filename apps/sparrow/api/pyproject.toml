[project]
name = "sparrow"
version = "0.7.9"
description = "AI concierge for a private Plex server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
sparrow = "sparrow.__main__:main"
sparrow-eval = "sparrow.evals:main"
sparrow-sandbox = "sparrow.sandbox:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparrow"]

[tool.ruff]
# Pinned so lint matches everywhere; without this ruff falls back to
# whatever machine-level config is present, which CI won't have.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `setting()` returns a `dataclasses.field()`, like `field()` itself (RUF009).
extend-immutable-calls = ["sparrow.config.setting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One line of dots, as the bun and vitest suites print, with no running percentage.
console_output_style = "classic"
asyncio_mode = "auto"
