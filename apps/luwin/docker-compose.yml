name: luwin

services:
  luwin:
    # Built from the repo root so the image can reach workspace files; the
    # Dockerfile's own ignore file keeps the context to what it copies.
    build:
      context: ../..
      dockerfile: apps/luwin/Dockerfile
    image: luwin
    container_name: luwin
    restart: unless-stopped
    ports:
      - '8020:8020'
    env_file:
      - .env
    volumes:
      - ./luwin-data:/data
      # Media shares, read-only, for the file health check. Match the paths
      # the arr instances report so a Sonarr/Radarr file path resolves here.
      - /volume1/Vermithor:/Vermithor:ro
      - /volume1/Meleys:/Meleys:ro
      - /volume1/Syrax:/Syrax:ro
      - /volume1/Caraxes:/Caraxes:ro
      - /volume1/Vhagar:/Vhagar:ro
    healthcheck:
      # /health is the one ungated route, which is what lets this probe run
      # without a Discord connection.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Seerr, Sonarr, Radarr, SABnzbd, Tautulli and Wizarr live in the NAS-side
  # "westeroz" (Meleys) and "essoz" (Vermithor) projects, so luwin reaches
  # them through their host-published ports (the *_URL values in .env), not
  # container DNS. See wizteros/docs/arr-stack.md for the map.
