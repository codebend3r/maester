appId: io.github.codebend3r.raven.app
name: A film plays from its page under raven's controls, and Back returns to the page
tags:
  - touch
---
- runFlow: signIn.yaml
- extendedWaitUntil:
    visible: Kestrel Point
    timeout: 30000
- tapOn: Kestrel Point
- extendedWaitUntil:
    visible: Mark watched
    timeout: 30000
- tapOn: Play
# The film is an MKV, which plays through the server's HLS remux. The controls show while it
# starts, and a pause keeps them up.
- extendedWaitUntil:
    visible: Pause
    timeout: 60000
# The controls fade five seconds into a play, and Maestro can take longer than that to settle on
# a playing video, so a tap can land on the hidden controls' catcher. Each try brings the controls
# back when they are gone and presses Pause when it is there, until Play shows.
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            visible: Show the controls
          commands:
            - tapOn: Show the controls
      - runFlow:
          when:
            visible: Pause
          commands:
            - tapOn: Pause
      - assertVisible: Play
- assertVisible: Position
- assertVisible: Back 10 seconds
- assertVisible: Forward 10 seconds
- tapOn: Back
# The film is a minute long and a tap on a playing video can take several seconds to settle, so
# the server may already count it watched by the pause. Either way the page is back, and a watched
# film has its mark taken off first, so the marks below start from the same place.
- extendedWaitUntil:
    visible: Mark watched|Watched
    timeout: 30000
- runFlow:
    when:
      visible: Watched
    commands:
      - tapOn: Watched
      - extendedWaitUntil:
          visible: Mark watched
          timeout: 10000
# The spot saved on the pause is cleared by a mark, and taking the mark off again leaves the
# film as the fixture had it, never started.
- tapOn: Mark watched
- extendedWaitUntil:
    visible: Watched
    timeout: 10000
- tapOn: Watched
- extendedWaitUntil:
    visible: Mark watched
    timeout: 10000
- assertVisible: Play
