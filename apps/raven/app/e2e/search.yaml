appId: io.github.codebend3r.raven.app
name: A search from Home finds a title and opens it, and a library searches its own
tags:
  - touch
---
- runFlow: signIn.yaml
- extendedWaitUntil:
    visible: Lantern Bay
    timeout: 30000
# Home's header holds the search through every library; Search hands what was typed to its page.
- tapOn: Search every library
- inputText: lantern
- tapOn: Search
- extendedWaitUntil:
    visible: Back
    timeout: 10000
# The search runs under the library holding the match.
- extendedWaitUntil:
    visible: See all in Series
    timeout: 30000
- tapOn: Lantern Bay
- extendedWaitUntil:
    visible: Seasons
    timeout: 30000
- tapOn: Back
# A search that finds nothing says so.
- tapOn: Clear search
- tapOn: Search every library
- inputText: nowhere
- tapOn: Search
- extendedWaitUntil:
    visible: Nothing in any library matches "nowhere".
    timeout: 30000
- tapOn: Back
# A library's own box searches it.
- extendedWaitUntil:
    visible: See all in Films
    timeout: 30000
- tapOn: See all in Films
- extendedWaitUntil:
    visible: Search Films
    timeout: 30000
- tapOn: Search Films
- inputText: nowhere
- tapOn: Search
- extendedWaitUntil:
    visible: Nothing here matches "nowhere".
    timeout: 30000
# Cleared, the library lists everything again, on its grid.
- tapOn: Clear search
- extendedWaitUntil:
    visible: Kestrel Point
    timeout: 30000
