appId: io.github.codebend3r.raven.app
name: Open the fixture server on a clean install
# The build names the fixture through EXPO_PUBLIC_RAVEN_BYPASS_ORIGIN, so this accountless test
# goes straight to Home on it: the app never asks for a PIN.
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: Kestrel Point
    timeout: 60000
