appId: io.github.codebend3r.raven.app
name: Sign in to the fixture server with its PIN and admin password
# The fixture server's address and secrets, as `serve:fixture` prints them. The Android TV
# emulator reaches the computer's loopback through `adb reverse tcp:8490 tcp:8490`, which
# `e2e:android-tv` sets up first, so both platforms sign in to the same address.
env:
  SERVER: http://127.0.0.1:8490
  PIN: '1357'
  ADMIN_PASSWORD: Raven-Admin-2026
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: Sign in to raven
    timeout: 60000
# Maestro drives the iPhone simulator and the Android TV emulator: the thumb on one, the
# remote on the other.
- runFlow:
    when:
      platform: iOS
    file: steps/signIn.touch.yaml
- runFlow:
    when:
      platform: Android
    file: steps/signIn.dpad.yaml
