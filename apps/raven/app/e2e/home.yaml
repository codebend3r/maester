appId: io.github.codebend3r.raven.app
name: Home shows the fixture's movie and series
---
- runFlow: signIn.yaml
# On a TV the series' shelf sits below the screen, under the hero and the films (and Continue
# watching, when anything is), so the remote moves down to it: from the hero's Play to the film,
# to the series' See all, then to its card.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            notVisible: Lantern Bay
          times: 5
          commands:
            - pressKey: Remote Dpad Down
# On an iPhone the hero fills most of the screen, so Home scrolls down to the series' card.
- runFlow:
    when:
      platform: iOS
    file: steps/shelfCard.touch.yaml
    env:
      TITLE: Lantern Bay
      SHELF: Series
- assertVisible: Series
- assertVisible: Lantern Bay
