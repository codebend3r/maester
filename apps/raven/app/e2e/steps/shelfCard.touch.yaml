appId: io.github.codebend3r.raven.app
name: Scroll Home to ${TITLE}'s card on the ${SHELF} shelf
---
# The hero above the shelves rotates through the titles, so a title's name alone may be the
# hero's slide; its card is the one below its shelf's title. On a phone the hero fills most of
# the screen, so Home scrolls down to the card.
# On Android the shelf's title comes to the middle, its first cards on screen under it: a scroll
# straight to the card moves past the title, and centering the card would push the title off the
# top, where the card is no longer told apart beneath it.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: ${SHELF}
          direction: DOWN
          centerElement: true
          timeout: 30000
# The iPhone's tab bar covers the foot of the page, and iOS still reports what scrolls under it as
# on screen, so a scroll brings its target to the middle, clear of the bar, before the tap.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: ${TITLE}
            below: ${SHELF}
          direction: DOWN
          centerElement: true
          timeout: 30000
