appId: io.github.codebend3r.raven.app
name: From a focused card whose title has a saved spot, clear the spot with a mark and its undoing
# The card's page opens offering to resume. The spot is cleared by a mark, and taking the mark off
# again leaves the title as the fixture had it, never started, so Play stands where Resume did
# and nothing is under Continue watching for it. ROW is the row the marks stand in, first for a
# film and second for an episode, as toggleMark takes it. Back leaves the page; where it lands
# is the caller's to wait for.
---
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible:
      text: Resume from .*
      focused: true
    timeout: 30000
- runFlow:
    file: toggleMark.dpad.yaml
    env:
      MARK: Mark watched
      MARKED: Watched
      ROW: ${ROW}
# The remote is on the mark now, so the undoing walks no row.
- runFlow:
    file: toggleMark.dpad.yaml
    env:
      MARK: Watched
      MARKED: Mark watched
      ROW: first
- assertVisible: Play
- pressKey: Back
