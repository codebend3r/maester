appId: io.github.codebend3r.raven.app
name: A title opens from Home, marks watched and back, and a show leads to its episodes
tags:
  - touch
---
- runFlow: signIn.yaml
# A movie's card opens its page, with Play from the top, as it was never started.
- runFlow:
    file: steps/shelfCard.touch.yaml
    env:
      TITLE: Kestrel Point
      SHELF: Films
# A press that lands as Home is still settling from the scroll opens nothing, and the flow then
# waits on a page that never comes, so a press that opened nothing is made once more.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: Kestrel Point
          below: Films
      - extendedWaitUntil:
          visible: Mark watched
          timeout: 30000
- assertVisible: Play
# Watched shows as soon as it is pressed, and pressing it again takes the mark off, so the
# fixture is left as it was found.
- tapOn: Mark watched
- extendedWaitUntil:
    visible: Watched
    timeout: 10000
- tapOn: Watched
- extendedWaitUntil:
    visible: Mark watched
    timeout: 10000
- runFlow: steps/back.yaml
# A show lists its seasons, and a season its episodes, each opening its page.
- runFlow:
    file: steps/shelfCard.touch.yaml
    env:
      TITLE: Lantern Bay
      SHELF: Series
# A press that lands as Home is still settling from the scroll opens nothing, and the flow then
# waits on a page that never comes, so a press that opened nothing is made once more.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: Lantern Bay
          below: Series
      - extendedWaitUntil:
          visible: Seasons
          timeout: 30000
# The actions, Download among them, push the seasons and episodes below the tab bar on a phone.
- scrollUntilVisible:
    element: Season 1
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Season 1
- scrollUntilVisible:
    element: Episodes
    direction: DOWN
    centerElement: true
    timeout: 30000
# A row is read out with its line and watched state after its name.
- scrollUntilVisible:
    element: E1 · Low Tide.*
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: E1 · Low Tide.*
# The episode's place over its title is a link back to its show, read out by where it goes.
- extendedWaitUntil:
    visible: Back to Lantern Bay
    timeout: 30000
- assertVisible: Low Tide
- assertVisible: Mark watched
