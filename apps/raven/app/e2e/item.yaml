appId: io.github.codebend3r.raven.app
name: A title opens from Home, marks watched and back, and a show leads to its episodes
tags:
  - touch
---
- runFlow: signIn.yaml
# A movie's card opens its page, with Play from the top, as it was never started.
- runFlow:
    file: steps/shelfCard.touch.yaml
    env:
      TITLE: Kestrel Point
      SHELF: Films
- tapOn:
    text: Kestrel Point
    below: Films
- extendedWaitUntil:
    visible: Mark watched
    timeout: 30000
- assertVisible: Play
# Watched shows as soon as it is pressed, and pressing it again takes the mark off, so the
# fixture is left as it was found.
- tapOn: Mark watched
- extendedWaitUntil:
    visible: Watched
    timeout: 10000
- tapOn: Watched
- extendedWaitUntil:
    visible: Mark watched
    timeout: 10000
- runFlow: steps/back.yaml
# A show lists its seasons, and a season its episodes, each opening its page.
- runFlow:
    file: steps/shelfCard.touch.yaml
    env:
      TITLE: Lantern Bay
      SHELF: Series
- tapOn:
    text: Lantern Bay
    below: Series
- extendedWaitUntil:
    visible: Seasons
    timeout: 30000
- tapOn: Season 1
- extendedWaitUntil:
    visible: Episodes
    timeout: 30000
# A row is read out with its line and watched state after its name.
- tapOn: E1 · Low Tide.*
- extendedWaitUntil:
    visible: S01 · E01
    timeout: 30000
- assertVisible: Low Tide
- assertVisible: Mark watched
