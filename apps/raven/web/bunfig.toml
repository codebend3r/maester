[test]
# happy-dom must register the DOM before test-setup imports Testing Library,
# eventSource and mediaError stand in for the EventSource and MediaError
# happy-dom lacks, and scss-modules registers its loader ahead of any
# component import.
preload = [
  "./src/test/happy-dom.ts",
  "./src/test/eventSource.ts",
  "./src/test/mediaError.ts",
  "../../../tooling/web/scss-modules.ts",
  "./src/test-setup.ts",
]
# Coverage counts raven web's own source: not the tests, the test harness,
# the shared loader, or built libraries, which their own tests cover.
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "src/test/**",
  "src/test-setup.ts",
  "../../../tooling/**",
  "../../../libs/**",
]
