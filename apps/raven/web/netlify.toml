# raven's web app on Netlify, with its API on Vhagar behind Tailscale Funnel.
# The site's package directory is apps/raven/web and its base directory the
# repo root, where bun.lock is: Netlify installs and builds there, so the
# paths below are from the root. RAVEN_API_ORIGIN, set in the site's
# environment variables, is where the build's _redirects sends /api (see
# vite.config.ts).

[build]
command = "bash apps/raven/netlify-build.sh"
publish = "apps/raven/web/dist"
# Production builds only on release, through the build hook release.yml calls;
# previews only when something the site bundles changed (netlify-ignore.sh).
ignore = "bash apps/raven/netlify-ignore.sh apps/raven/web apps/raven/netlify-build.sh libs/raven/core libs/raven/ui scripts/bump_version.sh"

# The functions, bundled by Netlify after the build: each is the file named after its
# folder, so a test beside it is never bundled. RAVEN_API_ORIGIN is scoped to them too,
# for the pictures function.
[functions]
directory = "apps/raven/web/netlify/functions"

[build.environment]
BUN_VERSION = "1.4.2"
BUN_FLAGS = "--frozen-lockfile"
NX_DAEMON = "false"

# Vite hashes every file under assets/, as raven's own server assumes.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The single-page app's fallback. Netlify reads _redirects first, so /api
# never lands here.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
