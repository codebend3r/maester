# raven on Vhagar, the NAS with the Intel GPU, where it lives as
# /volume1/docker/raven/docker-compose.yml beside vhagar-update.sh (as
# update.sh). The main smoke test publishes the image on every merge that
# changes it, and update.sh pulls it: see "Running on Vhagar" in README.md.
services:
  raven:
    image: ghcr.io/codebend3r/raven:latest
    container_name: raven
    restart: unless-stopped
    # crivas:users, who owns ./data; 937 is the videodriver group that owns
    # /dev/dri/renderD128 on this box, as for jellyfin.
    user: '1026:100'
    group_add:
      - '937'
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Only DSM's reverse proxy faces the internet: the router forwards the
    # public port to its Remote Access rule, which proxies here. Never forward
    # 8484 itself (README, "Remote access").
    ports:
      - '8484:8484'
    # TMDB_API_TOKEN and the other optional keys in .env.example. Compose
    # 2.20 here needs the file to exist, so update.sh makes an empty one.
    env_file:
      - .env
    environment:
      - QUICK_SCAN_INTERVAL_MINUTES=10
      # DSM's reverse proxy reaches raven through this network's gateway
      # (below), the one address whose X-Forwarded-For raven believes.
      - RAVEN_TRUSTED_PROXIES=172.30.84.1
    volumes:
      - /volume1/docker/raven/data:/config
      # Every NAS's share under /media/<nas>, read-write so deleting in the
      # app removes the file. Vhagar's own share is local; the other four
      # are its cifs mounts of theirs.
      - /volume1/Vhagar:/media/vhagar
      - /volume1/Vhagar/Caraxes:/media/caraxes
      - /volume1/Vhagar/Meleys:/media/meleys
      - /volume1/Vhagar/Syrax:/media/syrax
      - /volume1/Vhagar/Vermithor:/media/vermithor

# A fixed subnet, so the gateway RAVEN_TRUSTED_PROXIES names stays the one
# DSM's reverse proxy comes through. Changing it needs `docker compose down`
# once, since compose will not move a running network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.84.0/24
          gateway: 172.30.84.1
