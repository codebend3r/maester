<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101816" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Wren plays the music library on your own raven server. Sign in with your raven account to listen anywhere."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wren</title>
    <script>
      /*
       * The kept theme goes on before first paint, so the page never flashes another;
       * theme/followTheme.ts takes over once the app loads. An older Wren kept `appearance`,
       * whose Light and Dark are Paper and Night.
       */
      try {
        const kept = JSON.parse(localStorage.getItem('wren.prefs') ?? '{}')?.state ?? {}
        const isLight = matchMedia('(prefers-color-scheme: light)').matches
        const forDevice = isLight ? (kept.lightTheme ?? 'paper') : (kept.darkTheme ?? 'night')
        const older = { light: 'paper', dark: 'night' }[kept.appearance]
        const single = kept.themeMode === 'single' ? kept.theme : undefined
        const isFollowing = kept.themeMode === 'system'
        document.documentElement.dataset.theme = isFollowing
          ? forDevice
          : (single ?? older ?? forDevice)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
