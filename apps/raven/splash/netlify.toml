# The splash at maester.tv: Maester's home, and raven's and Wren's pages under it
# (/raven/, /wren/). The site's package directory is apps/raven/splash and its
# base directory the repo root, where bun.lock is: Netlify installs and builds
# there, so the paths below are from the root.

[build]
command = "bun run build:raven:splash"
publish = "apps/raven/splash/dist"
# Production builds only on release, through the build hook release.yml calls;
# previews only when something the site bundles changed (netlify-ignore.sh).
ignore = "bash apps/raven/netlify-ignore.sh apps/raven/splash libs/shared/http"

[build.environment]
BUN_VERSION = "1.4.2"
BUN_FLAGS = "--frozen-lockfile"
NX_DAEMON = "false"

# A short address to type into a TV's Downloader app: the dev builds page, which lists the
# APKs device-release.yml attaches to each release. GitHub's releases/latest is no use here,
# since the newest release is often a build tag (vX.Y.Z.N), which carries no APK.
[[redirects]]
from = "/tv"
to = "/dev-builds/"
status = 302

# Vite hashes every file under assets/.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
