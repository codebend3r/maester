<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15201e" />
    <meta
      name="description"
      content="Every version of Raven for Mac and Windows, with its downloads."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Every version of Raven</title>
  </head>
  <body class="document">
    <header class="masthead">
      <a class="wordmark" href="/">
        <img src="/brand/raven-mark-on-dark.svg" alt="" width="34" height="37" />
        <span>Raven</span>
      </a>
      <nav class="masthead-links" aria-label="Project">
        <a href="https://github.com/codebend3r/maester">
          <svg class="icon" aria-hidden="true"><use href="/brand/icons.svg#github" /></svg>
          <span>Source</span>
        </a>
        <a href="/releases/" aria-current="page">
          <svg class="icon" aria-hidden="true"><use href="/brand/icons.svg#tag" /></svg>
          <span>Releases</span>
        </a>
      </nav>
    </header>

    <main class="page">
      <section class="versions">
        <div class="pitch">
          <h1>Every version</h1>
          <p>
            Each release of Raven for Mac and Windows, newest first, with its files. The app checks
            for the next one itself, so you only need one of these.
          </p>
        </div>
        <p class="fine versions-status" id="versions-status">Asking GitHub for the list.</p>
        <ul class="version-list" id="versions"></ul>
      </section>
    </main>

    <footer class="colophon">
      <span class="colophon-mark">
        <img src="/brand/raven-mark-on-dark.svg" alt="" width="20" height="22" />
        <span>raven</span>
      </span>
      <nav class="colophon-links" aria-label="Footer">
        <a href="https://github.com/codebend3r/maester">Source</a>
        <a href="https://github.com/codebend3r/maester/releases">Releases on GitHub</a>
      </nav>
    </footer>

    <script type="module" src="/src/versions.ts"></script>
  </body>
</html>
