services:
  raven:
    # Built from the repo root, which holds the workspace's bun.lock; the
    # Dockerfile's own ignore file keeps the context to what it copies.
    build:
      context: ../..
      dockerfile: apps/raven/Dockerfile
    image: raven:latest
    container_name: raven
    ports:
      - '8484:8484'
    volumes:
      # The index and the thumbnail cache. Survives rebuilds; delete it to start over.
      - ./data:/config
      # Every folder a library should read, mounted read-only under /media.
      # Libraries use the container path on the right, e.g. /media/movies.
      - /path/to/Movies:/media/movies:ro
      - /path/to/TV:/media/tv:ro
    environment:
      # Rescan every library on a timer (minutes); 0 means only on boot and on demand.
      - RESCAN_INTERVAL_MINUTES=0
    # Transcode on an Intel GPU: pass its render node in and join the group
    # that owns it on the host (`stat -c %g /dev/dri/renderD128`). /api/health
    # then reports "encoder": "vaapi"; without these it stays on the CPU.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - '937'
    # The image runs as the unprivileged `node` user (1000:1000). On a
    # Synology or any host where ./data belongs to someone else, run as the
    # owner instead, e.g. user: '1026:100'.
    # user: '1026:100'
    restart: unless-stopped
