appId: app.netlify.wren
name: An album plays from its page, and the bar follows Next to the second track
---
- runFlow: steps/signIn.yaml
- extendedWaitUntil:
    visible: Recently added
    timeout: 30000
- tapOn: Library.*
- tapOn: Albums
- extendedWaitUntil:
    visible: Morning Chorus.*
    timeout: 30000
- tapOn: Morning Chorus.*
- extendedWaitUntil:
    visible: Shuffle
    timeout: 30000
- tapOn:
    text: Play
    waitToSettleTimeoutMs: 500
# Each track lasts twenty seconds. Cap settling around playback controls so Maestro reads
# the next track before it ends, then pause it to keep the final assertion stable.
- extendedWaitUntil:
    visible: 'Now Playing: First Light.*'
    timeout: 30000
- tapOn:
    text: Next
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Pause
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Now Playing: Dawn Song.*'
    timeout: 30000
