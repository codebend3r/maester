# Installed by `bun install` through lefthook's postinstall; `bunx lefthook install` reinstalls.
pre-commit:
  jobs:
    # Lints and formats the staged files and restages what it fixes (lint-staged.config.ts).
    - name: 🧹 lint-staged
      run: bunx lint-staged

# The checks `bun run verify` runs, one at a time, stopping at the first that fails.
pre-push:
  piped: true
  jobs:
    - name: ✨ format check
      run: bunx nx run-many -t format:check

    - name: 🔎 typecheck
      run: bunx nx run-many -t typecheck

    - name: 🐍 lint python
      run: bunx nx run-many -t lint:py

    - name: 🟦 lint typescript
      run: bunx nx run-many -t lint:ts

    - name: 🎨 lint css
      run: bunx nx run-many -t lint:css

    - name: 📝 spellcheck
      run: bunx nx run-many -t spellcheck

    - name: 🧪 test
      run: bunx nx run-many -t test

    - name: 📦 build
      run: bunx nx run-many -t build
