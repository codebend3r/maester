# Installed by `bun install` through lefthook's postinstall; `bunx lefthook install` reinstalls.
pre-commit:
  jobs:
    # Lints and formats the staged files and restages what it fixes (lint-staged.config.ts).
    - name: 🧹 lint-staged
      run: bun run lint-staged

# The checks `bun run verify` runs but dead-code and dead-css, which the PR checks run instead,
# as one Nx run (`verify:push`), so its tasks share one daemon and one lock instead of a dozen
# racing for them, beside the repository-rule audit.
pre-push:
  parallel: true
  jobs:
    - name: ✅ verify:push
      run: bun run verify:push

    # Claude Code reads the commits being pushed against CLAUDE.md for the rules no linter checks.
    - name: 🧭 CLAUDE.md audit
      run: bun run claude-audit
