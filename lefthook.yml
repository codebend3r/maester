# Installed by `bun install` through lefthook's postinstall; `bunx lefthook install` reinstalls.
pre-commit:
  jobs:
    # Lints and formats the staged files and restages what it fixes (lint-staged.config.ts).
    - name: 🧹 lint-staged
      run: bun run lint-staged

# The checks `bun run verify` runs, one at a time, stopping at the first that fails.
# All but dead-code and dead-css, which the PR checks run instead.
pre-push:
  parallel: true
  jobs:
    - name: ✨ format check
      run: bun run format:check

    - name: 🔎 typecheck
      run: bun run typecheck

    - name: 🟦 TypeScript only
      run: bun run typescript-only

    - name: 🐍 lint python
      run: bun run lint:py

    - name: 🚧 lint typescript
      run: bun run lint:ts

    - name: 🎨 lint css
      run: bun run lint:css

    - name: 📝 spellcheck
      run: bun run spellcheck

    - name: 🧩 One command per script
      run: bun run one-command-per-script

    - name: 🧪 test
      run: bun run test

    - name: 📱 test screens
      run: bun run test:screens

    - name: 📦 build
      run: bun run build
